    -webkit-mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 78%,
      transparent 82%,
      transparent 100%

    mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 78%,
      transparent 82%,
      transparent 100%
    );
  }
  
  90% {
    transform: scale(0.95);
    -webkit-mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 88%,
      transparent 92%,
      transparent 100%
    );
    mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 88%,
      transparent 92%,
      transparent 100%
    );
  }

  100% {
    opacity: 0;
    background-size: 0 0;
    transform: scale(1);
    -webkit-mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 100%

    mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 100%
    );
  }
}

@keyframes ripple-dark {
  0% {
    background-image: radial-gradient(
      circle at center,
      rgba(255, 255, 255, 0.13) 0%,
      rgba(255, 255, 255, 0) 5%,
      rgba(255, 255, 255, 0) 100%

  }
  
  25% {
    background-image: radial-gradient(
      circle at center,
      rgba(255, 255, 255, 0.13) 0%,
      rgba(255, 255, 255, 0.13) 15%,
      rgba(255, 255, 255, 0) 25%,
      rgba(255, 255, 255, 0) 100%
    );
  }
  
  50% {
    background-image: radial-gradient(
      circle at center,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.13) 35%,
      rgba(255, 255, 255, 0.13) 45%,
      rgba(255, 255, 255, 0) 55%,
      rgba(255, 255, 255, 0) 100%
    );
  }
  
  75% {
    background-image: radial-gradient(
      circle at center,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0) 45%,
      rgba(255, 255, 255, 0.13) 75%,
      rgba(255, 255, 255, 0.13) 85%,
      rgba(255, 255, 255, 0) 95%,
      rgba(255, 255, 255, 0) 100%
    );
  }

  100% {
    background-image: radial-gradient(
      circle at center,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0) 100%
    );
  }
}

  --mask-offset: 100px;
  -webkit-mask: linear-gradient(to bottom,transparent,#fff var(--mask-offset) calc(100% - var(--mask-offset)),transparent),linear-gradient(to right,transparent,#fff var(--mask-offset) calc(100% - var(--mask-offset)),transparent);

  -webkit-mask-composite: source-in,xor;

}

.lab-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(#00000021 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(circle at center, transparent 0%, transparent 100%);
  mask-image: radial-gradient(circle at center, transparent 0%, transparent 100%);

  transform: translateZ(0);
  backface-visibility: hidden;
  perspective: 1000;

.dark .lab-bg::before {
  background-image: radial-gradient(#ffffff22 1px, transparent 1px);
}

body {
