.rgp-root { position: relative; width: 100%; overflow: hidden; isolation: isolate; }
.rgp-gate {
  position: absolute; inset: 0; z-index: 2; overflow: hidden; background: var(--rgp-floor);
  color: var(--rgp-type); transition: opacity 700ms cubic-bezier(.65,0,.35,1), visibility 0s linear 700ms;
  -webkit-font-smoothing: antialiased;
}
.rgp-gate[data-phase="open"] { opacity: 0; visibility: hidden; pointer-events: none; }
.rgp-gate canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; max-width: none; }
.rgp-corner {
  position: absolute; display: flex; flex-direction: column; gap: 6px; z-index: 1;
  font-family: var(--rgp-mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
  transition: opacity 600ms ease;
}
.rgp-tr { right: clamp(18px, 3vw, 40px); top: clamp(18px, 3vw, 34px); text-align: right; opacity: .62; }
.rgp-br { right: clamp(18px, 3vw, 40px); bottom: clamp(16px, 3vw, 28px); text-align: right; }
.rgp-count { font-size: 12px; letter-spacing: .14em; font-variant-numeric: tabular-nums; }
.rgp-gate[data-phase="wind"] .rgp-corner, .rgp-gate[data-phase="clear"] .rgp-corner { opacity: 0; }
.rgp-close {
  position: absolute; left: 0; right: 0; top: 50%; z-index: 1; text-align: center;
  opacity: 0; transform: translateY(calc(-50% + 10px)); pointer-events: none;
  transition: opacity 900ms ease, transform 1100ms cubic-bezier(.2,.7,.1,1);
}
.rgp-gate[data-phase="clear"] .rgp-close { opacity: 1; transform: translateY(-50%); }
.rgp-blessing { display: block; font-size: 15px; letter-spacing: .08em; opacity: .7; margin-bottom: 6px; }
.rgp-message { margin: 0; font-family: var(--rgp-serif); font-style: italic; font-weight: 400; font-size: clamp(28px, 4.6vw, 54px); line-height: 1; }
.rgp-replay { display: block; margin-top: 12px; font-family: var(--rgp-mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; opacity: .5; }
.rgp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  .rgp-close, .rgp-corner { transition: none; }
