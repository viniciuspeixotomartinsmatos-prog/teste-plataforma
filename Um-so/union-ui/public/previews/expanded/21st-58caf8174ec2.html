@keyframes ripple {
  0% {
    opacity: 0;
    background-size: 0 0;
    transform: scale(0.1);

      circle at center,
      black 0%,
      black 0%,

      transparent 100%

      circle at center,
      black 0%,
      black 0%,
      transparent 2%,
      transparent 100%
    );
  }
  
  10% {

      circle at center,
      black 0%,

      black 0%,
      black 8%,

      circle at center,
      black 0%,

      transparent 22%,
      transparent 100%
    );
  }

  }

  60% {

      circle at center,

      transparent 62%,

    );

      circle at center,
      transparent 0%,
      black 58%,
      transparent 62%,
      transparent 100%
    );
  }
  
  70% {
    transform: scale(0.8);
    -webkit-mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 68%,
      transparent 72%,
      transparent 100%
    );
    mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 68%,
      transparent 72%,
      transparent 100%
    );
  }
  
  80% {
    transform: scale(0.9);
    -webkit-mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 78%,
      transparent 82%,
      transparent 100%
    );
    mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 78%,
      transparent 82%,
      transparent 100%
    );
  }
  
  90% {
    transform: scale(0.95);
    -webkit-mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 88%,
      transparent 92%,
      transparent 100%
    );
    mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      black 88%,
      transparent 92%,
      transparent 100%
    );
  }

  100% {
    opacity: 0;
    background-size: 0 0;
    transform: scale(1);
    -webkit-mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 100%
    );
    mask-image: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 100%
    );
  }
}

.lab-bg {
  --mask-offset: 100px;
  -webkit-mask: linear-gradient(to bottom,transparent,#fff var(--mask-offset) calc(100% - var(--mask-offset)),transparent),linear-gradient(to right,transparent,#fff var(--mask-offset) calc(100% - var(--mask-offset)),transparent);
  mask: linear-gradient(to bottom,transparent,#fff var(--mask-offset) calc(100% - var(--mask-offset)),transparent),linear-gradient(to right,transparent,#fff var(--mask-offset) calc(100% - var(--mask-offset)),transparent);
  -webkit-mask-composite: source-in,xor;
  mask-composite: intersect;
  transform: translateZ(0);
  backface-visibility: hidden;
  perspective: 1000;
}

.lab-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(#00000021 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(circle at center, transparent 0%, transparent 100%);
  mask-image: radial-gradient(circle at center, transparent 0%, transparent 100%);
  animation: ripple 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  will-change: transform, mask-image, -webkit-mask-image, background-size, opacity;
  transform: translateZ(0);
  backface-visibility: hidden;
  perspective: 1000;
}

.dark .lab-bg::before {
  background-image: radial-gradient(#ffffff22 1px, transparent 1px);
}

    0%, 100% {
        transform: translateX(-4px);
    }
    50% {
        transform: translateX(0px);
    }
}

    0%, 100% {
        opacity: 0.6;
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.3));
    }
    50% {
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
    }
}

    }

        transform: translateY(0);
        filter: blur(0);
    }
}

.lighting-button:hover {
