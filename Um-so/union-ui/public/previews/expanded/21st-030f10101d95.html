    --bs-color-surface-3: oklch(0.272 0.01 76);
    --bs-color-surface-4: oklch(0.29 0.01 76);
    --bs-color-surface-5: oklch(0.31 0.01 76);

    --bs-color-primary-subtle: var(--bs-color-feicui-100);
    --bs-color-primary-subtle-text: var(--bs-color-feicui-800);
    --bs-color-primary-border: var(--bs-color-feicui-300);
    --bs-color-focus: var(--bs-color-primary);
  }

  [data-theme="dark"] [data-accent="feicui"],
  [data-theme="dark"][data-accent="feicui"],
  :host([data-theme="dark"][data-accent="feicui"]) {
    --bs-color-primary: var(--bs-color-feicui-500);
    --bs-color-primary-hover: var(--bs-color-feicui-600);
    --bs-color-primary-active: var(--bs-color-feicui-700);
    /* Dark retires the mid-tone fill: the solid body drops one step to the
       full-chroma 700 (hover 800) — deep enough for bright paper ink past
       4.5:1 without kneading the pigment toward black. Light fills straight
       from 600; dark fills straight from 700. */
    --bs-color-primary-fill: var(--bs-color-feicui-700);
    --bs-color-primary-fill-hover: var(--bs-color-feicui-800);
    --bs-color-primary-text: var(--bs-color-gray-25);
    --bs-color-primary-subtle: color-mix(in oklab, var(--bs-color-primary) 16%, transparent);
    --bs-color-primary-subtle-text: var(--bs-color-feicui-300);
    --bs-color-primary-border: var(--bs-color-feicui-700);
  }

  [data-accent="jilan"] {
    --bs-color-primary: var(--bs-color-jilan-600);
    --bs-color-primary-hover: var(--bs-color-jilan-700);
    --bs-color-primary-active: var(--bs-color-jilan-800);
    /* See qinghua: the fill must derive at the accent host, not the root. */
    --bs-color-primary-fill: var(--bs-color-primary);
    --bs-color-primary-fill-hover: var(--bs-color-primary-hover);
    --bs-color-primary-text: oklch(0.988 0.004 95);
    --bs-color-primary-subtle: var(--bs-color-jilan-100);
    --bs-color-primary-subtle-text: var(--bs-color-jilan-800);
    --bs-color-primary-border: var(--bs-color-jilan-300);
    --bs-color-focus: var(--bs-color-primary);
  }

  [data-theme="dark"] [data-accent="jilan"],
  [data-theme="dark"][data-accent="jilan"],
  :host([data-theme="dark"][data-accent="jilan"]) {
    --bs-color-primary: var(--bs-color-jilan-500);
    --bs-color-primary-hover: var(--bs-color-jilan-600);
    --bs-color-primary-active: var(--bs-color-jilan-700);
    /* Dark retires the mid-tone fill: the solid body drops one step to the
       full-chroma 700 (hover 800) — deep enough for bright paper ink past
       4.5:1 without kneading the pigment toward black. Light fills straight
       from 600; dark fills straight from 700. */
    --bs-color-primary-fill: var(--bs-color-jilan-700);
    --bs-color-primary-fill-hover: var(--bs-color-jilan-800);
    --bs-color-primary-text: var(--bs-color-gray-25);
    --bs-color-primary-subtle: color-mix(in oklab, var(--bs-color-primary) 16%, transparent);
    --bs-color-primary-subtle-text: var(--bs-color-jilan-300);
    --bs-color-primary-border: var(--bs-color-jilan-700);
  }

  [data-accent="qingjin"] {
    --bs-color-primary: var(--bs-color-qingjin-600);
    --bs-color-primary-hover: var(--bs-color-qingjin-400);
    --bs-color-primary-active: var(--bs-color-qingjin-700);
    /* See qinghua: the fill must derive at the accent host, not the root. */
    --bs-color-primary-fill: var(--bs-color-primary);
    --bs-color-primary-fill-hover: var(--bs-color-primary-hover);
    --bs-color-primary-text: oklch(0.988 0.004 95);
    --bs-color-primary-subtle: var(--bs-color-qingjin-100);
    --bs-color-primary-subtle-text: var(--bs-color-qingjin-800);
    --bs-color-primary-border: var(--bs-color-qingjin-300);
    --bs-color-focus: var(--bs-color-primary);
  }

  [data-theme="dark"] [data-accent="qingjin"],
  [data-theme="dark"][data-accent="qingjin"],
  :host([data-theme="dark"][data-accent="qingjin"]) {
    --bs-color-primary: var(--bs-color-qingjin-500);
    --bs-color-primary-hover: var(--bs-color-qingjin-400);
    --bs-color-primary-active: var(--bs-color-qingjin-700);
    /* Dark retires the mid-tone fill: the solid body drops one step to the
       full-chroma 700 (hover 800) — deep enough for bright paper ink past
       4.5:1 without kneading the pigment toward black. Light fills straight
       from 600; dark fills straight from 700. */
    --bs-color-primary-fill: var(--bs-color-qingjin-700);
    --bs-color-primary-fill-hover: var(--bs-color-qingjin-800);
    --bs-color-primary-text: var(--bs-color-gray-25);
    --bs-color-primary-subtle: color-mix(in oklab, var(--bs-color-primary) 16%, transparent);
    --bs-color-primary-subtle-text: var(--bs-color-qingjin-300);
    --bs-color-primary-border: var(--bs-color-qingjin-700);
  }


  /* Typography — two tracks: the voice and the chrome. The voice is the song
     stack (upright, structured strokes — Noto Serif SC falling back through the
     platform faces); headings and editorial narrative ride it, the way Western
     systems let a serif carry voice. The chrome is the modern hei stack: the
     platform UI faces lead so Latin letters and figures hold one rhythm with the
     CJK around them — a Chinese face reaching Latin first drops its digits onto
     a taller, heavier cut, and the line reads out of true. The CJK set falls in
     behind — MiSans and HarmonyOS Sans into PingFang / YaHei. Sizes are fixed
     rem values outside the density scale; compact UI may choose
     --bs-font-size-sm but never below it; table microcopy is the one
     sanctioned 2xs exception. */

  :root,
  :host {
    --bs-font-sans:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, MiSans, "HarmonyOS Sans SC",
      "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --bs-font-serif:
      "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, "Times New Roman", Georgia, serif;
    --bs-font-mono:
      ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "PingFang SC", "Microsoft YaHei",
      monospace;

    --bs-font-size-2xs: 0.625rem;
    --bs-font-size-xs: 0.75rem;
    --bs-font-size-sm: 0.8125rem;
    --bs-font-size-md: 0.875rem;
    --bs-font-size-base: 0.9375rem;
    --bs-font-size-lg: 1.0625rem;
    --bs-font-size-xl: 1.25rem;
    --bs-font-size-2xl: 1.5rem;
    --bs-font-size-3xl: 1.875rem;
    --bs-font-size-4xl: 2.25rem;

    /* The stroke icons are drawn with: one width, tuned to sit beside the
       hairline instead of fighting it. */
    --bs-icon-stroke-width: 1.75;

    --bs-line-height-tight: 1.25;
    --bs-line-height-snug: 1.375;
    --bs-line-height-normal: 1.5;
    --bs-line-height-relaxed: 1.625;

    /* Eyebrow kickers share one tracked voice — the same whisper everywhere
       an eyebrow announces a section, so no page improvises its own. */
    --bs-tracking-eyebrow: 0.14em;

    /* Control labels carry a whisper of tracking — upright and unhurried is a
       property of CJK typesetting, not of any single typeface. */
    --bs-tracking-label: 0.02em;

    --bs-font-weight-regular: 400;
    --bs-font-weight-medium: 500;
    --bs-font-weight-semibold: 600;
    --bs-font-weight-bold: 700;
  }


  /* Motion — the ink-and-light grammar. Three rules and a floor:
     Light needs time — shadows transition about 1.5x slower than the property
     that raised them, so a shadow reads as cast light, not a sticker.
     Ink bleeds — surfaces enter by fading AND dissolving (blur to sharp),
     never popping. Puppets have strings — moving parts overshoot on the spring
     curve, and lists follow one another with a small stagger.
     Tokens drive all transitions; the reduced-motion block retunes them instead
     of removing states, so opacity still communicates elevation changes. */

  /* Defaults sit at zero specificity (:where): the motion sheet can appear
     twice in the compiled bundle — once before and once after scene.css —
     and a plain :root would tie [data-scene] on specificity and, in that
     second copy, outrank it by file order, silencing every scene that
     retunes the curves below. */
  :where(:root),
  :where(:host) {
    /* Durations ride --bs-motion-scale so a scene preset can tune the pace
       (a snappier instrument, an unhurried civic register) without touching
       the reduced-motion floor below, which declares 1ms directly. */
    /* A truly zero-length step: transitions end without playing. */
    --bs-duration-none: 0ms;
    --bs-duration-instant: calc(80ms * var(--bs-motion-scale, 1));
    --bs-duration-fast: calc(140ms * var(--bs-motion-scale, 1));
    --bs-duration-base: calc(200ms * var(--bs-motion-scale, 1));
    --bs-duration-slow: calc(320ms * var(--bs-motion-scale, 1));

    /* Shadow light trails the surface; sustained ambient motion keeps its
       own semantic tempo so scenes can tune it and reduced motion can
       silence it without touching component sheets. */
    --bs-duration-shadow: calc(var(--bs-duration-base) * 1.5);
    --bs-duration-loop: calc(1600ms * var(--bs-motion-scale, 1));
    --bs-duration-spinner: calc(900ms * var(--bs-motion-scale, 1));
    --bs-duration-marquee: calc(30s * var(--bs-motion-scale, 1));

    --bs-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --bs-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --bs-ease-in: cubic-bezier(0.7, 0, 0.84, 0);
    --bs-ease-spring: cubic-bezier(0.34, 1.3, 0.5, 1);

    /* Stagger step for lists and menus — each follower comes up 24ms after
       the one before it, like puppets lifted in sequence. */
    --bs-stagger-step: 24ms;

    /* The press wash (ink-ripple) reads its pigment, reach, curve, and pace
       from these, so a scene preset can retune the feedback — a smaller,
       crisper wave in the flat content color for material, or silence for
       registers that press without a wash — without touching the keyframes
       in the core. The pigment is an opaque color and --bs-ripple-opacity
       is the whole concentration — the two never double-deduct. */
    --bs-ripple-pigment: var(--bs-color-primary);
    --bs-ripple-opacity: 0.27;
    --bs-ripple-core: 0%;
    --bs-ripple-fade: 80%;
    --bs-ripple-duration: calc(650ms * var(--bs-motion-scale, 1));
    --bs-ripple-release: calc(320ms * var(--bs-motion-scale, 1));
    --bs-ripple-ease: var(--bs-ease-out);
    --bs-ripple-spread: 1;
  }

  /* Surfaces dissolve in like ink settling into paper: a fade, a soft focus
     pulling sharp, and a one-percent settle. Panels and menus apply it on
     their open state; exits stay plain opacity fades — faster, unobtrusive. */
  @keyframes bs-ink-in {
    from {
      opacity: 0;
      filter: blur(3px);
      scale: 1.01;
    }
    to {
      opacity: 1;
      filter: blur(0);
      scale: 1;
    }
  }

  /* Followers rise into place on the string — a short lift with the spring
     curve. Combine with per-item \`animation-delay: calc(var(--bs-i) * var(--bs-stagger-step))\`. */
  @keyframes bs-item-in {
    from {
      opacity: 0;
      translate: 0 4px;
    }
    to {
      opacity: 1;
      translate: 0 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    :root,
    :host {
      --bs-duration-none: 0ms;
      --bs-duration-instant: 1ms;
      --bs-duration-fast: 1ms;
      --bs-duration-base: 1ms;
      --bs-duration-slow: 1ms;
      --bs-duration-shadow: 1ms;
      --bs-duration-loop: 1ms;
      --bs-duration-spinner: 1ms;
      --bs-duration-marquee: 1ms;
      --bs-stagger-step: 0ms;
    }
  }


  /* Scene presets — one attribute that retunes the temperament of the whole
     interface. Two families share the same five levers: the audience scenes
     serve a desk (civic for elders and civic desks, tech for modern
     efficiency products, enterprise the quiet commercial baseline, studio
     the literati gathering for design and editorial work), and the style
     scenes borrow the temperament of the major design languages — named for
     the open specs and the places their platforms are built, never the
     companies: cupertino for the soft airy handheld register, expressive
     for motion-forward spring, fluent for measured productivity depth,
     material for the elevation-led android-era look, missive and its
     office sibling dispatch for the familiar handheld registers, metric
     for the metric productivity register.

     A scene moves only what the paper allows: shape (radius), density, motion
     pace and its curves, where the key light stands and how far it reaches,
     and how the press wash spreads. A style scene follows the register it
     borrows whole — so it may also re-point the focus tokens, speaking
     focus in the register's own dialect instead of the house halo — and it
     may retint the paper itself (the surface ladder, light and dark) where
     the borrowed register demands its own stock, and let the type follow
     the register's voice — the one font move allowed is the platform's own
     stack, which is what the register would speak in anyway. No scene
     touches interaction logic or the semantic pigments. Each scene pairs
     with a default accent and (for civic) the high-contrast tier; those
     pairings are applied by the theme engine as plain data attributes, so
     the accent and contrast rules — including their dark variants — carry
     them unchanged.

     Explicit attributes always outrank the scene's bundled defaults: a
     \`[data-accent]\`, \`[data-contrast]\`, or \`[data-density]\` set alongside
     \`[data-scene]\` wins by cascade order. Note \`:root\` ties \`[data-scene]\` in
     specificity (both 0,1,0), so this file must sit after every stylesheet
     that declares these variables on \`:root\` (themes, primitives via accent's
     placement) and before density.css, whose explicit tiers must win over
     scene defaults. */
  [data-scene] {
    /* Re-anchor the ink at the scene boundary, for the same reason the themes
       re-anchor theirs: an inherited \`color\` was already resolved in the
       room's register, and the scene's paper must not wear it. */
    color: var(--bs-color-text-primary);
  }

  [data-scene="civic"] {
    /* 典章 — for elders and civic desks: the square-cut register of official
       documents. Corners go true square (a seal is not round), targets grow
       to the spacious ladder (48px controls), the pace slows so states are
       never missed, and the light stays flat so nothing hides in a shadow. */
    --bs-radius-sm: 0rem;
    --bs-radius-md: 0.125rem;
    --bs-radius-lg: 0.25rem;
    --bs-radius-xl: 0.375rem;
    --bs-radius-2xl: 0.5rem;
    --bs-control-height-sm: 2.25rem;
    --bs-control-height-md: 2.625rem;
    --bs-control-height-lg: 3rem;
    --bs-density-scale: 1.5;
    --bs-motion-scale: 1.25;
    --bs-light-x: 0px;
    --bs-light-y: 0px;
    --bs-light-reach: 0.7;
  }

  [data-scene="enterprise"] {
    /* 信笺 — the measured commercial baseline: default geometry at a calmer
       light, so long working sessions read quiet and the hairlines do the
       talking. */
    --bs-density-scale: 1;
    --bs-motion-scale: 1;
    --bs-light-x: 0px;
    --bs-light-y: 0px;
    --bs-light-reach: 0.85;
  }

  [data-scene="studio"] {
    /* 雅集 — the literati gathering for design and editorial work: controls
       keep the 6px seal edge, vessels round out generously, whitespace
       breathes, and the light comes from the upper left, casting each
       element's shadow gently toward the lower right. */
    --bs-radius-md: 0.625rem;
    --bs-radius-lg: 0.875rem;
    --bs-radius-xl: 1.25rem;
    --bs-radius-2xl: 1.75rem;
    --bs-control-height-sm: 2rem;
    --bs-control-height-md: 2.25rem;
    --bs-control-height-lg: 2.75rem;
    --bs-density-scale: 1.25;
    --bs-motion-scale: 1;
    --bs-light-x: 0.125rem;
    --bs-light-y: 0.125rem;
    --bs-light-reach: 1.25;
  }

  [data-scene="tech"] {
    /* 司南 — the modern precision instrument: near-square corners, dense
       rows, a snappy pace, and a flat restrained light where hairlines carry
       all the hierarchy. */
    --bs-radius-sm: 0.125rem;
    --bs-radius-md: 0.25rem;
    --bs-radius-lg: 0.5rem;
    --bs-radius-xl: 0.75rem;
    --bs-radius-2xl: 1rem;
    --bs-control-height-sm: 1.5rem;
    --bs-control-height-md: 1.75rem;
    --bs-control-height-lg: 2rem;
    --bs-density-scale: 0.75;
    --bs-motion-scale: 0.85;
    --bs-light-x: 0px;
    --bs-light-y: 0px;
    --bs-light-reach: 0.5;
  }

  /* The style scenes — five-lever homages, never clones: no frosted
     materials, no imported fonts (a scene's voice goes only to the
     platform's own stack), just the temperament a scene's levers can
     honestly reach. */

  [data-scene="cupertino"] {
    /* 圆融 — the soft airy register of handheld design: the capsule is
       the action signal (every pressable thing rounds full), vessels round out
       dramatically, targets grow to the 44px touch ladder, and motion
       glides on the long sheet-spring curve. The interface stays light and
       airy — separation reads as gentle diffuse depth, not cast shadow,
       and presses answer through the fill change, never a wash. */
    --bs-radius-md: 0.75rem;
    --bs-radius-lg: 1.125rem;
    --bs-radius-xl: 1.5rem;
    --bs-radius-2xl: 2.25rem;
    --bs-radius-control: var(--bs-radius-full);
    --bs-control-height-sm: 2.25rem;
    --bs-control-height-md: 2.75rem;
    --bs-control-height-lg: 3.125rem;
    --bs-density-scale: 1.25;
    --bs-motion-scale: 1.1;
    --bs-ease-out: cubic-bezier(0.32, 0.72, 0, 1);
    --bs-ease-spring: cubic-bezier(0.34, 1.1, 0.64, 1);
    --bs-light-x: 0px;
    --bs-light-y: 0px;
    --bs-light-reach: 0.8;
    --bs-ripple-opacity: 0;
    /* Focus speaks the platform dialect: a crisp 2px accent outline
       pulled inside the control's edge — no halo. */
    --bs-focus-ring: inset 0 0 0 2px var(--bs-color-focus);
    --bs-focus-ring-inset: inset 0 0 0 2px var(--bs-color-focus);
    /* The handheld register speaks in the system voice: headlines stand
       down from the serif — everything rides the sans stack — and labels
       lose their brush tracking. */
    --bs-font-serif: var(--bs-font-sans);
    --bs-tracking-label: 0em;
  }

  /* The borrowed papers. Seven of the style scenes retint the surface
     ladder toward the register they borrow from — cupertino's clean
     handheld white, material's neutral violet-gray, sketch's warm
     sketchbook stock, and the neutral grounds the missive family and
     the metric register speak against — while the paper-and-ink scenes keep
     the house stock. Custom properties on the root resolve per theme
     attribute, so each paper carries a light and a dark face. */
  [data-scene="cupertino"] {
    --bs-color-surface-0: oklch(0.962 0.004 265);
    --bs-color-surface-1: oklch(0.981 0.001 265);
    --bs-color-surface-2: oklch(1 0 0);
    --bs-color-surface-3: oklch(1 0 0);
    --bs-color-surface-4: oklch(1 0 0);
    --bs-color-surface-5: oklch(1 0 0);
    --bs-color-text-primary: oklch(0.208 0 0);
    --bs-color-text-secondary: oklch(0.628 0.008 265);
    --bs-color-text-tertiary: oklch(0.76 0.006 265);
    --bs-color-text-disabled: oklch(0.83 0.005 265);
    --bs-color-border: oklch(0.85 0.005 265);
    --bs-color-border-strong: oklch(0.79 0.006 265);
    --bs-color-scrim: oklch(0 0 0 / 0.4);
    --bs-shadow-ink: oklch(0.25 0.01 265);
  }

  [data-scene="cupertino"][data-theme="dark"],
  [data-scene="cupertino"]:not([data-theme]):where([data-theme="dark"] *) {
    --bs-color-surface-0: oklch(0.18 0.004 265);
    --bs-color-surface-1: oklch(0.216 0.004 265);
    --bs-color-surface-2: oklch(0.245 0.004 265);
    --bs-color-surface-3: oklch(0.272 0.004 265);
    --bs-color-surface-4: oklch(0.29 0.004 265);
    --bs-color-surface-5: oklch(0.31 0.004 265);
    --bs-color-text-primary: oklch(1 0 0);
    --bs-color-text-secondary: oklch(0.68 0.006 265);
    --bs-color-text-tertiary: oklch(0.55 0.005 265);
    --bs-color-text-disabled: oklch(0.4 0.004 265);
    --bs-color-border: oklch(0.31 0.005 265);
    --bs-color-border-strong: oklch(0.38 0.006 265);
    --bs-color-scrim: oklch(0 0 0 / 0.5);
  }

  [data-scene="expressive"] {
    /* 飞白 — the motion-forward register, the dry brush that races ahead
       of the ink. Generous rounding, a quick pace, and curves that overshoot
       on the spring — the interface answers like an instrument, not a
       form — under a warm key light from above. Focus speaks the
       register's dialect: the solid pigment outline. */
    --bs-radius-sm: 0.375rem;
    --bs-radius-md: 0.5rem;
    --bs-radius-lg: 0.75rem;
    --bs-radius-xl: 1rem;
    --bs-radius-2xl: 1.5rem;
    /* Every press is a pill in the expressive register, on the 32/40/48
       container ladder. */
    --bs-radius-control: var(--bs-radius-full);
    --bs-control-height-sm: 2rem;
    --bs-control-height-md: 2.5rem;
    --bs-control-height-lg: 3rem;
    --bs-motion-scale: 0.8;
    --bs-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --bs-ease-spring: cubic-bezier(0.34, 1.56, 0.5, 1);
    --bs-light-x: 0.1875rem;
    --bs-light-y: 0.1875rem;
    --bs-light-reach: 1;
    --bs-focus-ring: 0 0 0 3px var(--bs-color-focus);
    --bs-focus-ring-inset: inset 0 0 0 3px var(--bs-color-focus);
  }

  [data-scene="fluent"] {
    /* 流水 — the measured productivity register, 行云流水: the corner
       ladder runs 2/4/8/12 (shapes under 32px round to 2, controls 4,
       vessels 8, sheets 12), measured rows on the 24/32/40 control ladder,
       a brisk pace on the decelerate and standard curves, and a soft key
       light from straight above whose shadows fall close to the element —
       depth as quiet layering, no ripple. The paper goes neutral, both
       faces, the register's own calm gray. */
    --bs-radius-sm: 0.125rem;
    --bs-radius-md: 0.25rem;
    --bs-radius-lg: 0.5rem;
    --bs-radius-xl: 0.75rem;
    --bs-radius-2xl: 1rem;
    --bs-control-height-sm: 1.5rem;
    --bs-control-height-md: 2rem;
    --bs-control-height-lg: 2.5rem;
    --bs-density-scale: 0.9;
    --bs-motion-scale: 0.85;
    --bs-ease-out: cubic-bezier(0.1, 0.9, 0.2, 1);
    --bs-ease-in-out: cubic-bezier(0.33, 0, 0.67, 1);
    --bs-light-x: 0px;
    --bs-light-y: 0.125rem;
    --bs-light-reach: 0.7;
    --bs-ripple-opacity: 0;
    /* Focus speaks the register's dialect: the edge stays neutral while a
       2px brand underline carries the state — structure, not glow. */
    --bs-focus-edge: var(--bs-color-border);
    --bs-focus-ring: inset 0 -2px 0 0 var(--bs-color-focus);
    --bs-focus-ring-inset: inset 0 -2px 0 0 var(--bs-color-focus);
  }

  /* The layers: light sits on the calm gray ground with layered whites
     rising above it; dark climbs through three gray steps. Chroma zero —
     this register keeps no pigment in its paper. */
