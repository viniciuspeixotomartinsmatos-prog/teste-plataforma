  <style>
    :host {
      --shared-dialog-surface: #fff;
      --shared-dialog-ink: oklch(22% 0.008 250);
      --shared-dialog-muted: oklch(56% 0.008 250);
      --shared-dialog-line: oklch(88% 0.006 250);
      --shared-dialog-danger: oklch(52% 0.205 27);
      --shared-dialog-success: oklch(55% 0.15 148);
      --shared-dialog-shadow:
        0 4px 8px -2px rgba(16, 24, 40, 0.10),
        0 2px 4px -2px rgba(16, 24, 40, 0.06);
      --shared-dialog-panel-duration: 300ms;
      --shared-dialog-content-duration: 150ms;

      --duration-micro: 80ms;
      --duration-quick: 150ms;
      --duration-fast: 250ms;
      --duration-slow: 400ms;
      --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: ease-in-out;
      --ease-linear: linear;
      --distance-micro: 4px;
      --distance-base: 8px;
      --scale-large: 0.96;
      --blur-small: 2px;

      --text-swap-dur: var(--duration-quick);
      --text-swap-translate-y: var(--distance-micro);
      --text-swap-blur: var(--blur-small);
      --text-swap-ease: var(--ease-in-out);

      --modal-open-dur: var(--duration-fast);
      --modal-close-dur: var(--duration-quick);
      --modal-scale: var(--scale-large);
      --modal-scale-close: var(--scale-large);
      --modal-ease: var(--ease-smooth-out);

      --check-opacity-dur: var(--duration-fast);
      --check-path-dur: 200ms;
      --check-path-delay: var(--duration-micro);
      --check-ease-out: var(--ease-smooth-out);
      --check-ease-opacity: var(--ease-smooth-out);
      --check-ease-path: var(--ease-smooth-out);

      --delete-morph-dur: var(--shared-dialog-panel-duration);
      --delete-morph-ease: var(--ease-smooth-out);
      --matched-text-dur: var(--shared-dialog-content-duration);
      --success-content-dur: var(--duration-micro);
      --success-content-delay: 0ms;

      --ink: var(--shared-dialog-ink);
      --ink-muted: var(--shared-dialog-muted);
      --surface: var(--shared-dialog-surface);
      --surface-muted: oklch(98% 0.004 250);
      --line: var(--shared-dialog-line);
      --line-strong: oklch(82% 0.01 250);
      --danger: var(--shared-dialog-danger);
      --danger-soft: oklch(97% 0.018 27);
      --success: var(--shared-dialog-success);
      --success-soft: oklch(96% 0.035 148);
      --focus-ring: color-mix(in srgb, var(--ink) 22%, transparent);
      --button-shadow:
        var(--shared-dialog-shadow);
      --card-shadow:
        var(--shared-dialog-shadow);

      display: contents;
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        system-ui, sans-serif;
      font-synthesis: none;
      font-kerning: normal;
      -webkit-font-smoothing: antialiased;
    }

    :host([hidden]) {
      display: none;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    button {
      font: inherit;
    }

    dialog {
      width: min(24rem, calc(100vw - 1.5rem));
      max-width: none;
      max-height: calc(100dvh - 1rem);
      margin: auto;
      padding: 0;
      overflow: visible;
      border: 0;
      background: transparent;
      color: inherit;
    }

    dialog::backdrop {
      background: transparent;
    }

    dialog.is-closing::backdrop {
      background: transparent;
    }

    dialog:focus {
      outline: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 13.5rem;
      contain: layout;
      isolation: isolate;
    }

    .confirm-card {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 1.5rem;
    }

    .confirm-card::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      border: 1px solid var(--line);
      border-radius: 1.125rem;
      background: var(--surface);
      box-shadow: var(--card-shadow);
      content: "";
      opacity: 1;
      transition: opacity var(--duration-quick) var(--ease-smooth-out);
    }

    .confirm-card.is-morphing::before {
      opacity: 0;
      transition: none;
    }

    .confirm-copy {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      transition:
        transform var(--duration-quick) var(--ease-smooth-out),
        opacity var(--duration-quick) var(--ease-smooth-out);
    }

    .confirm-card.is-morphing .confirm-copy {
      z-index: 5;
      transform: none;
      opacity: 1;
      pointer-events: none;
      transition: none;
    }

    .confirm-card.is-morphed .confirm-copy {
      opacity: 0;
      pointer-events: none;
      transition: none;
    }

    .confirm-card.is-morphing .actions {
      z-index: 5;
      pointer-events: none;
    }

    .confirm-card.is-morphing .cancel {
      transform: none;
      opacity: 1;
      pointer-events: none;
      transition: none;
    }

    .confirm-card.is-morphed .cancel {
      opacity: 0;
      pointer-events: none;
      transition: none;
    }

    h2,
    p {
      margin: 0;
    }

    .title {
      max-width: 23ch;
      font-size: 1rem;
      font-weight: 630;
      letter-spacing: -0.018em;
      line-height: 1.35;
      text-wrap: balance;
    }

    .description {
      max-width: 37ch;
      margin-top: 0.5rem;
      color: var(--ink-muted);
      font-size: 0.9375rem;
      font-weight: 430;
      letter-spacing: -0.003em;
      line-height: 1.55;
      text-wrap: pretty;
    }

    .actions {
      position: absolute;
      z-index: 1;
      right: 1.5rem;
      bottom: 1.5rem;
      left: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.625rem;
      height: 3rem;
    }

    .cancel,
    .done {
      min-width: 0;
      min-height: 3rem;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: var(--surface);
      cursor: pointer;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition:
        transform var(--duration-quick) var(--ease-smooth-out),
        background-color var(--duration-quick) var(--ease-smooth-out),
        border-color var(--duration-quick) var(--ease-smooth-out),
        opacity var(--duration-quick) var(--ease-smooth-out);
    }

    .cancel {
      color: var(--ink);
    }

    .cancel:active,
    .done:active {
      transform: scale(0.98);
    }

    .cancel:focus-visible,
    .done:focus-visible,
    .delete-button:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .delete-slot {
      min-width: 0;
      height: 3rem;
    }

    .success-target {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(18.75rem, calc(100% - 1.5rem));
      height: 12.75rem;
      transform: translate(-50%, -50%);
      visibility: hidden;
      pointer-events: none;
    }

    .morph-surface {
      position: absolute;
      z-index: 4;
      left: calc(50% + 0.3125rem);
      top: calc(100% - 4.5rem);
      width: calc(50% - 1.8125rem);
      height: 3rem;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: var(--surface);
      box-shadow: none;
      contain: layout;
    }

    .morph-surface.is-success {
      border-width: 1px;
      border-radius: 1.125rem;
      box-shadow: var(--card-shadow);
    }

    .hold-fill {
      position: absolute;
      z-index: 0;
      inset: 0;
      background: var(--danger-soft);
      transform: scaleX(var(--hold-progress, 0));
      transform-origin: left center;
      opacity: 1;
      transition: opacity var(--duration-micro) var(--ease-smooth-out);
      will-change: transform;
    }

    .morph-surface[data-state="idle"] .hold-fill {
      transition:
        transform var(--duration-quick) var(--ease-smooth-out),
        opacity var(--duration-micro) var(--ease-smooth-out);
    }

    .morph-surface[data-state="morphing"] .hold-fill,
    .morph-surface[data-state="success"] .hold-fill {
      opacity: 0;
    }

    .morph-surface[data-state="morphing"] .hold-fill {
      transition: none;
    }

    .delete-button {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      padding: 0 1rem;
      touch-action: none;
      border: 0;
      border-radius: inherit;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      -webkit-touch-callout: none;
      user-select: none;
      transition:
        transform var(--duration-quick) var(--ease-smooth-out),
        background-color var(--duration-quick) var(--ease-smooth-out),
        opacity var(--duration-micro) var(--ease-smooth-out);
    }

    .morph-surface[data-state="holding"] .delete-button,
    .morph-surface[data-state="armed"] .delete-button {
      transform: scale(0.98);
      background: transparent;
    }

    .morph-surface[data-state="awaiting"] .delete-button {
      transform: none;
      cursor: wait;
    }

    .morph-surface[data-state="morphing"] .delete-button {
      transform: none;
      opacity: 0;
      pointer-events: none;
      transition: none;
    }

    .morph-surface[data-state="success"] .delete-button {
      transform: translateY(calc(var(--distance-micro) * -1));
      opacity: 0;
      pointer-events: none;
    }

    .success-content {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: flex;
      visibility: hidden;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--success-content-dur) var(--ease-smooth-out) var(--success-content-delay);
    }

    .morph-surface[data-state="morphing"] .success-content,
    .morph-surface[data-state="success"] .success-content {
      visibility: visible;
      opacity: 1;
    }

    .morph-surface[data-state="success"] .success-content {
      pointer-events: auto;
    }

    .success-message {
      display: flex;
      width: 100%;
      min-height: 0;
      flex-direction: column;
      align-items: center;
    }

    .check-disc.t-success-check {
      display: grid;
      width: 2.25rem;
      height: 2.25rem;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--success-soft);
      color: var(--success);
      line-height: 0;
    }

    .check-disc svg {
      display: block;
      width: 1.125rem;
      height: 1.125rem;
    }

    .success-title {
      margin-top: 0.5rem;
      font-size: 1rem;
      font-weight: 630;
      letter-spacing: -0.012em;
      line-height: 1.42;
      text-align: center;
      text-wrap: balance;
    }

    .success-description {
      max-width: 31ch;
      margin-top: 0.25rem;
      color: var(--ink-muted);
      font-size: 0.9375rem;
      font-weight: 430;
      letter-spacing: -0.003em;
      line-height: 1.5;
      text-align: center;
      text-wrap: pretty;
    }

    .done {
      width: 100%;
      margin-top: 0;
      background: var(--surface);
      color: var(--ink);
    }

    .done:disabled {
      cursor: default;
    }

    .reset-row {
      position: fixed;
      z-index: 6;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      display: none;
      justify-content: center;
      margin: 0;
      transform: translateX(-50%);
    }

    .reset-button {
      position: relative;
      min-width: 4rem;
      min-height: 2rem;
      padding: 0 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.5625rem;
      background: var(--surface);
      box-shadow: var(--button-shadow);
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: -0.006em;
      transition:
        transform var(--duration-quick) var(--ease-smooth-out),
        border-color var(--duration-quick) var(--ease-smooth-out),
        color var(--duration-quick) var(--ease-smooth-out);
    }

    .reset-button::before {
      position: absolute;
      inset: -0.375rem;
      content: "";
    }

    .reset-button:active {
      transform: scale(0.98);
    }

    .reset-button:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .reset-outside {
      position: fixed;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      display: none;
      transform: translateX(-50%);
    }

    :host([show-reset]) .reset-row {
      display: flex;
    }

    :host([show-reset]) .reset-outside {
      display: block;
    }

    .reset-outside:active {
      transform: translateX(-50%) scale(0.98);
    }

    dialog[open] + .reset-outside {
      visibility: hidden;
      pointer-events: none;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (hover: hover) and (pointer: fine) {
      .cancel:hover,
      .done:hover,
      .reset-button:hover {
        border-color: var(--line-strong);
      }

      .reset-button:hover {
        color: var(--ink);
      }

      .delete-button:hover {
        background: var(--danger-soft);
      }
    }

    @media (max-height: 29rem) {
      dialog {

        scrollbar-width: none;
      }

        display: none;
      }

      }

      .actions {
        right: 1.25rem;
        bottom: 1.25rem;
        left: 1.25rem;
      }

      .morph-surface {
        left: calc(50% + 0.3125rem);

        padding: 1rem;
      }

    .t-modal.is-open {

      opacity: 1;
      pointer-events: auto;
    }
    .t-modal.is-closing {

      opacity: 0;
      pointer-events: none;
      transition:

        opacity   var(--modal-close-dur) var(--modal-ease);

    @media (prefers-reduced-motion: reduce) {
      .t-modal { transition: none !important; }
    }

    /* transitions.dev — Text states swap */

      display: inline-block;
      transform: translateY(0);
      opacity: 1;
      transition:

      opacity: 0;

      transform: translateY(var(--text-swap-translate-y));
      opacity: 0;
      transition: none;
    }

      .t-text-swap { transition: none !important; }
    }

      transform-origin: center;
      opacity: 0;
      will-change: transform, opacity;

    .t-success-check svg path {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;

    .t-success-check[data-state="in"] {

    .t-success-check[data-state="in"] svg path {

      .hold-fill {
        transition: none !important;
      }

      }
