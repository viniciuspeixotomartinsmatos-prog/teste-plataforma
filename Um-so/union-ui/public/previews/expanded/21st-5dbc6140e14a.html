/* ---- bento-grid styles ---- */
@layer cojeev-states {
.v-bento {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: repeat(var(--bento-columns), minmax(0, 1fr));
  grid-template-rows: repeat(var(--bento-rows), minmax(88px, 1fr));
  gap: var(--s-3);
  width: 100%;
  min-width: 0;
  color: var(--v-on-accent);
  container-type: inline-size;
}
.v-bento__tile {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--s-4);
  padding: var(--s-7);
  min-width: 0;
  overflow-wrap: anywhere;
  border-radius: var(--r-card);
  background: var(--bento-fill);
  color: var(--v-on-accent);
}
/* Default text scales with its usable tile width, after the safe paint inset.
   Custom tile renderers retain their own sizing and container ownership. */
.v-bento__tile:has(> .v-bento__label) {
  container-type: inline-size;
}
.v-bento__color-0 {
  --bento-fill: var(--v-pink);
}
.v-bento__color-1 {
  --bento-fill: var(--v-blue);
}
.v-bento__color-2 {
  --bento-fill: var(--v-yellow);
}
.v-bento__color-3 {
  --bento-fill: var(--v-olive);
}
.v-bento__color-4 {
  --bento-fill: var(--v-beige);
  color: var(--v-text);
}
.v-bento__color-5 {
  --bento-fill: var(--v-blue);
}
.v-bento__number {
  font-size: var(--fs-caps);
  letter-spacing: 0.09em;
  line-height: 1.4;
  opacity: 0.65;
}
.v-bento__label {
  font-family: var(--font-display, inherit);
  font-size: clamp(16px, 12cqi, 30px);
  font-weight: var(--fw-medium);
  line-height: 1.15;
  letter-spacing: -0.025em;
  max-width: 18ch;
}
.v-bento__paint {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: -1;
}
.v-bento__paint path {
  fill: var(--bento-fill);
  stroke: var(--v-canvas);
  stroke-width: 8;
  stroke-linejoin: round;
}
.v-bento[data-variant="interlock"] {
  gap: 0;
}
.v-bento[data-variant="interlock"] > .v-bento__tile {
  background: transparent;
  border-radius: 0;
  padding: var(--s-8);
}
@media (max-width: 600px) {
  .v-bento[data-variant="interlock"] {
    gap: var(--s-3);
  }
  .v-bento {
    display: flex;
    flex-direction: column;
    gap: var(--s-3);
  }
  .v-bento__tile,
  .v-bento[data-variant="interlock"] > .v-bento__tile {
    min-height: 150px;
    padding: var(--s-6);
    background: var(--bento-fill);
    border-radius: var(--r-card);
  }
  .v-bento__paint {
    display: none;
  }
  .v-bento__label {
    font-size: var(--fs-section);
  }
  .v-bento[data-variant="interlock"] > .v-bento__tile {
    border-radius: var(--r-sheet) var(--r-card) var(--r-sheet) var(--r-card);
  }
}
}
