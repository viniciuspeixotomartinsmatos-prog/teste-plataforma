        /*
         * Quantum Cloud Loader
         *
         * Design principles:
         * - No gradients
         * - No abrupt direction changes
         * - Long, smooth animation curves
         * - Slight depth through scale + opacity
         * - Different orbital speeds create natural interaction
         */

        /* --------------------------------
           RED
           Fast but smooth horizontal orbit
        --------------------------------- */

        @keyframes quantum-red {
          0% {
            transform: translate3d(-46px, 7px, 0) scale(0.72);
            opacity: 0.45;
          }

          25% {
            transform: translate3d(-23px, -7px, 0) scale(0.95);
            opacity: 0.78;
          }

          50% {
            transform: translate3d(46px, 0, 0) scale(1.18);
            opacity: 1;
          }

          75% {
            transform: translate3d(23px, 7px, 0) scale(0.95);
            opacity: 0.78;
          }

          100% {
            transform: translate3d(-46px, 7px, 0) scale(0.72);
            opacity: 0.45;
          }
        }

        .animate-quantum-red {
          animation:
            quantum-red
            3.8s
            cubic-bezier(0.37, 0, 0.63, 1)
            infinite;
          will-change: transform, opacity;
        }


        /* --------------------------------
           BLUE
           Slow, heavy orbital movement
        --------------------------------- */

        @keyframes quantum-blue {
          0% {
            transform: translate3d(38px, -4px, 0) scale(1);
            opacity: 0.95;
          }

          25% {
            transform: translate3d(19px, 7px, 0) scale(0.88);
            opacity: 0.72;
          }

          50% {
            transform: translate3d(-38px, 3px, 0) scale(0.68);
            opacity: 0.42;
          }

          75% {
            transform: translate3d(-19px, -7px, 0) scale(0.88);
            opacity: 0.72;
          }

          100% {
            transform: translate3d(38px, -4px, 0) scale(1);
            opacity: 0.95;
          }
        }

        .animate-quantum-blue {
          animation:
            quantum-blue
            5.6s
            cubic-bezier(0.37, 0, 0.63, 1)
            infinite;
          will-change: transform, opacity;
        }


        /* --------------------------------
           YELLOW
           Smooth central oscillator
        --------------------------------- */

        @keyframes quantum-yellow {
          0% {
            transform: translate3d(-27px, 2px, 0) scale(0.82);
            opacity: 0.65;
          }

          20% {
            transform: translate3d(-17px, -5px, 0) scale(0.94);
            opacity: 0.82;
          }

          50% {
            transform: translate3d(27px, 0, 0) scale(1.08);
            opacity: 1;
          }

          80% {
            transform: translate3d(17px, 5px, 0) scale(0.94);
            opacity: 0.82;
          }

          100% {
            transform: translate3d(-27px, 2px, 0) scale(0.82);
            opacity: 0.65;
          }
        }

        .animate-quantum-yellow {
          animation:
            quantum-yellow
            3.1s
            cubic-bezier(0.37, 0, 0.63, 1)
            infinite;
          will-change: transform, opacity;
        }


        /* --------------------------------
           GREEN
           Slow wide orbital sweep
        --------------------------------- */

        @keyframes quantum-green {
          0% {
            transform: translate3d(64px, 6px, 0) scale(0.52);
            opacity: 0.25;
          }

          20% {
            transform: translate3d(43px, -5px, 0) scale(0.68);
            opacity: 0.45;
          }

          50% {
            transform: translate3d(0, 3px, 0) scale(1);
            opacity: 0.9;
          }

          80% {
            transform: translate3d(-43px, -5px, 0) scale(0.68);
            opacity: 0.45;
          }

          100% {
            transform: translate3d(-64px, 6px, 0) scale(0.52);
            opacity: 0.25;
          }
        }

        .animate-quantum-green {
          animation:
            quantum-green
            6.4s
            cubic-bezier(0.37, 0, 0.63, 1)
            infinite alternate;
          will-change: transform, opacity;
        }


        /* --------------------------------
           Accessibility
        --------------------------------- */

        @media (prefers-reduced-motion: reduce) {
          .animate-quantum-red,
          .animate-quantum-blue,
          .animate-quantum-yellow,
          .animate-quantum-green {
            animation: none;
          }
        }
      `})]})}f(e1,"CloudLoader");function n1(){return rl.jsx("div",{className:"flex h-screen w-screen items-center justify-center bg-white dark:bg-black transition-colors duration-300",children:rl.jsx("div",{className:"w-full max-w-xl px-4",children:rl.jsx(e1,{})})})}f(n1,"Page");function f1(){const j=new URL(window.location.href).searchParams.get("theme");return rl.jsx(wy,{defaultTheme:j||"light",enableSystem:!0,children:rl.jsx("div",{className:"w-screen min-h-screen flex justify-center items-center",children:rl.jsx(a1,{})})})}f(f1,"App");Ky.createRoot(document.getElementById("root")).render(rl.jsx(Gy.StrictMode,{children:rl.jsx(f1,{})}));</script>
