.main {
  --font-open-sans: "Open Sans", "Segoe UI", system-ui, sans-serif;
  --color-white: hsla(0, 0%, 100%, 1);
  --color-black: hsla(0, 0%, 0%, 1);
}

.main,
.main * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.main {
  font-family: var(--font-open-sans);
  font-size: 1rem;
  line-height: 1.75;
}

/* --- alice-scroll-story --------------------------------------------------- */

.main {
  max-width: 100vw;
  overflow-x: hidden;
}

.intro {
  align-items: center;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.intro__heading {
  font-size: clamp(1.875rem, 8.083vw + -0.217rem, 6.25rem);
  line-height: clamp(2.813rem, 9.815vw + 0.273rem, 8.125rem);
  text-align: center;
}

.content {
  background-color: #fff;
  display: flex;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.content--after-hero {
  padding: 6.25rem 0;
}

.article {
  max-width: 31.25rem;
  padding: 0 1rem;
}

.article p {
  margin-bottom: 1rem;
}

.hero-reveal {
  background-color: var(--color-black);
  position: relative;
  min-height: 100vh !important;
}

.hero-reveal__header {
  align-items: center;
  background-color: var(--color-white);
  color: var(--color-black);
  display: flex;
  font-size: clamp(3.125rem, 12.61vw + -0.138rem, 15.625rem);
  line-height: clamp(4.688rem, 15.763vw + 0.609rem, 20.313rem);
  font-weight: 900;
  justify-content: center;
  left: 0;
  min-height: 100vh;
  position: relative;
  top: 0;
  will-change: transform;
  z-index: 1;
}

.hero-reveal_split {
  align-items: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  width: 100%;
}

.hero-reveal_split_item {
  align-items: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 100vh;
  width: 100%;
}

.hero-reveal_split_item:nth-child(1) {
  -webkit-clip-path: inset(0 0 calc(50% - 1px) 0);
  clip-path: inset(0 0 calc(50% - 1px) 0);
}

.hero-reveal_split_item:nth-child(2) {
  -webkit-clip-path: inset(calc(50% - 1px) 0 0 0);
  clip-path: inset(calc(50% - 1px) 0 0 0);
  left: 0;
  position: absolute;
  top: 0;
}

.c-wide-text {
  margin: 0;
}

.hero-reveal__content {
  color: var(--color-white);
  display: flex;
  justify-content: center;
  padding: 0;
  position: relative;
  margin-top: -60vh;
}

.hero-reveal__content-inner {
  max-width: 31.25rem;
  position: relative;
  padding: 0 1rem;
}

.hero-reveal__content-p {
  padding-bottom: 8rem;
}

.hero-reveal__content-p p {
  margin-bottom: 1rem;
}

.hero-reveal__parallax {
  position: absolute;
  z-index: 0;
}

/* Tailwind Preflight applies "img { max-width: 100% }". This container is
   absolutely positioned with no width, so it shrink-wraps to 0px and that
   max-width collapses every parallax image to zero width - painted, but
   invisible. The original CodePen/bundle ships no Tailwind, hence no clash. */
.hero-reveal__parallax img {
  max-width: none;
}

/* Explicit intrinsic sizes below are load-order critical, not cosmetic: the
   parallax tweens animate yPercent, which GSAP resolves against each image's
   own height when the tween is built. Un-sized images measure 0 tall until
   they finish downloading, so yPercent resolves to 0px and the drift silently
   never happens. Values match each PNG's natural aspect ratio. */

.hero-reveal__parallax-clock {
  position: absolute;
  width: 150px;
  height: 167px;
  left: -100px;
  top: -400px;
}

.hero-reveal__parallax-book {
  position: absolute;
  width: 100px;
  height: 94px;
  left: -200px;
  top: -400px;
}

.hero-reveal__parallax-alice {
  position: absolute;
  width: 576px;
  height: 468px;
  top: -500px;
}

.hero-reveal__parallax-kattle {
  position: absolute;
  width: 50px;
  height: 41px;
  left: 500px;
  filter: blur(2px);
  top: -300px;
}

.hero-reveal__parallax-card {
  position: absolute;
  width: 330px;
  height: 340px;
  left: 400px;
  filter: blur(2px);
  z-index: 1;
  top: -400px;
}

@media (max-width: 768px) {
  .hero-reveal__parallax-kattle,
  .hero-reveal__parallax-card {
    left: 200px;
  }

  .hero-reveal__parallax-clock,
  .hero-reveal__parallax-book {
    left: -50px;
  }
}

sh you were down here with me! There are no mice in the air, I'm afraid, but you might catch a bat, and that's very like a mouse, you know. But do cats eat bats, I wonder?” And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, “Do cats eat bats? Do cats eat bats?” and sometimes, “Do bats eat cats?” for, you see, as she couldn't answer either question, it didn't much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and was saying to her very earnestly, “Now, Dinah, tell me the truth: did you ever eat a bat?” when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over."})]})]})})]})}),ct.jsx("section",{className:"content content--after-hero",children:ct.jsxs("article",{className:"article",children:[ct.jsx("p",{children:"Alice was not a bit hurt, and she jumped up on to her feet in a moment : she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, “Oh my ears and whiskers, how late it 's getting !” She was close behind it when she turned the corner, but the Rabbit was no longer to be seen : she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof"}),ct.jsx("p",{children:"There were doors all round the hall, but they were all locked, and when Alice had been all the way down one side and up the other, trying every door, she walked sadly down the middle, wondering how she was ever to get out again."}),ct.jsx("p",{children:"Suddenly she came upon a little three-legged table, all made of solid glass; there was nothing on it but a tiny golden key, and Alice's first idea was that this might belong to one of the doors of the hall ; but alas ! either the locks
