        body {
          margin: 0px;
          font-family: "Poppins", sans-serif;
          background: #531753;
        }
        
        .stacked-cards-container {
          position: relative;
          max-width: 700px;
          width: 100%;
          margin: 0px auto;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        
        .inner_container {
          position: relative;
          max-width: 400px;
          width: 100%;
          padding: 15px;
          border-radius: 25px;
          box-sizing: border-box;
        }
        
        .park_sec {
          position: relative;
          max-width: 100%;
          width: 100%;
          padding: 15px;
          border: 2px solid #EAEAE9;
          border-radius: 25px;
          box-sizing: border-box;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          margin-bottom: 10px;
          transition: all .3s cubic-bezier(.68,-0.55,.27,1.55);
          background: #fff;
          box-shadow: 0px 5px 10px rgba(32, 28, 28, 0.3);
        }
        
        .park_sec.active {
          transform: unset;
        }
        
        .park_sec1 {
          z-index: 2;
          transform: translateY(200%) scale(0.95);
        }
        
        .park_sec2 {
          z-index: 1;
          transform: translateY(100%) scale(0.9);
        }
        
        .park_sec3 {
          z-index: 0;
          transform: translateY(0px) scale(0.85);
        }
        
        .park_inside {
          position: relative;
          display: flex;
        }
        
        .content_sec {
          position: relative;
          margin-left: 10px;
        }
