    <style>
      :host {
        --liquid-surface: #fdfdfd;
        --liquid-ink: #191919;
        --liquid-muted: #686868;
        --liquid-blue: #1e55c7;
        display: block;
        width: 520px;
        max-width: 100%;
        aspect-ratio: 520 / 300;
        contain: layout style;
        color: var(--liquid-ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      svg.stage {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .surface-fill,
      .outline-edge,
      .surface,
      .debug-layer,
      .debug-layer path {
        pointer-events: none;
        vector-effect: non-scaling-stroke;
      }

      .surface-fill {
        fill: var(--liquid-surface);
        stroke: none;
      }

      .outline-edge {
        fill: none;
        stroke: #dedede;
        stroke-width: 1.5;
      }

      .surface {
        fill: none;
        stroke: #e2e2e2;
        stroke-width: 0.65;
      }

      :host(:focus-within) .surface {
        stroke: color-mix(in srgb, var(--liquid-blue) 42%, #e2e2e2);
        stroke-width: 1.1;
      }

      .content {
        width: 100%;
        height: 100%;
        color: var(--liquid-ink);
      }

      .output-content {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        padding: 0 12px 0 24px;
        transform-origin: 50% 100%;
      }

      .output-object {
        --output-blur: 0px;
        filter: blur(var(--output-blur));
      }

      .output-smear {
        pointer-events: none;
        opacity: 0;
      }

      :host([data-animating]) .output-content {
        will-change: opacity, transform;
      }

      :host([data-animating]) .input-content {
        will-change: transform;
      }

      .identity {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 13px;
        margin-right: auto;
        transform: translateY(-2px);
      }

      .notion-mark {
        display: block;
        width: 31px;
        height: 33px;
        flex: 0 0 31px;
        color: #111111;
      }

      .provider-copy {
        display: block;
        min-width: 0;
        line-height: 1;
      }

      .eyebrow {
        display: block;
        overflow: hidden;
        color: var(--liquid-muted);
        font-size: 11px;
        font-weight: 500;
        line-height: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .provider-name {
        display: block;
        margin-top: 1px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 18px;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        position: relative;
        border: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      button::before {
        position: absolute;
        top: 50%;
        left: 50%;
        width: max(100%, 44px);
        height: max(100%, 44px);
        content: "";
        transform: translate(-50%, -50%);
      }

      button:focus-visible {
        outline: 2px solid #2b70e8;
        outline-offset: 2px;
      }

      button:disabled {
        cursor: default;
      }

      .actions {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 21px;
        transform: translateY(-1px);
      }

      .skip {
        width: 32px;
        min-height: 32px;
        padding: 0;
        background: transparent;
        color: #525252;
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
      }

      .connect {
        width: 97px;
        height: 35px;
        padding: 0;
        border: 1px solid #ccd9f2;
        border-radius: 999px;
        background: #fdfdfd;
        box-shadow:
          0 1px 2px rgba(31, 73, 150, 0.06),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.8);
        color: var(--liquid-blue);
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
      }

      .connect:not(:disabled):hover {
        border-color: #adc4ec;
        background: #fafcff;
      }

      .connect:not(:disabled):active {
        transform: scale(0.97);
      }

      .input-content {
        position: relative;
        transform-origin: 50% 100%;
      }

      textarea {
        position: absolute;
        top: 19px;
        right: 24px;
        left: 23px;
        width: calc(100% - 47px);
        height: 54px;
        padding: 0;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: #242424;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.009em;
        line-height: 1.4;
      }

      textarea::placeholder {
        color: #535353;
        opacity: 1;
      }

      textarea:focus-visible {
        border-radius: 4px;
        outline: 2px solid #2b70e8;
        outline-offset: 4px;
      }

      .send {
        --send-offset-y: 0px;
        --send-height: 34px;
        --send-radius-y: 17px;
        --send-arrow-scale-y: 1;
        position: absolute;
        right: 14px;
        bottom: 17px;
        display: grid;
        width: 34px;
        height: var(--send-height);
        padding: 0;
        place-items: center;
        border-radius: 17px / var(--send-radius-y);
        background: #dedede;
        color: #ffffff;
        transform: translateY(var(--send-offset-y));
        transform-origin: 50% 50%;
      }

      .send:disabled {
        cursor: default;
      }

      .send:not(:disabled) {
        background: #2369df;
      }

      .send:not(:disabled):active {
        transform:
          translateY(var(--send-offset-y))
          scale(0.97);
      }

      .send svg {
        display: block;
        width: 15px;
        height: 15px;
        transform: scaleY(var(--send-arrow-scale-y));
        transform-origin: 50% 50%;
      }

      .debug-layer {
        display: none;
      }

      :host([debug]) .debug-layer {
        display: block;
      }

      .debug-actual,
      .debug-output,
      .debug-input,
      .debug-contact-zone,
      .debug-contact-band,
      .debug-waist {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }

      .debug-actual {
        stroke: #ff9348;
        stroke-width: 1.25;
      }

      .debug-output {
        stroke: #78a4ff;
        stroke-width: 1;
      }

      .debug-input {
        stroke: #78a4ff;
        stroke-width: 1;
      }

      .debug-contact-zone {
        stroke: #ff5353;
        stroke-opacity: 0.9;
        stroke-width: 1;
      }

      .debug-contact-band {
        stroke: #ff5353;
        stroke-dasharray: 2 3;
        stroke-opacity: 0.68;
        stroke-width: 0.85;
      }

      .debug-waist {
        stroke: #ff5353;
        stroke-dasharray: 3 3;
        stroke-width: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .connect,
        .send {
          transition-duration: 0ms;
        }
      }
    </style>
