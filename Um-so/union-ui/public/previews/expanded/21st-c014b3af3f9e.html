:root{background:#09090b;color:#f2f1ed;font-family:Arial,Helvetica,sans-serif;font-synthesis:none}
*{box-sizing:border-box}
html,body{min-width:320px}
body{margin:0}
button{font:inherit;cursor:pointer}
.landing-shell{--landing-bg:var(--demo-background);--landing-ink:#f2f1ed;--landing-muted:rgba(242,241,237,.62);--landing-line:rgba(242,241,237,.22);align-self:stretch;background:var(--landing-bg);color:var(--landing-ink);flex:0 0 100%;min-height:100dvh;min-width:100%;overflow:hidden;position:relative;transition:background-color 320ms ease;width:100%}
.landing-shell.is-light{--landing-bg:#eaeaeb;--landing-ink:#090a0b;--landing-muted:rgba(9,10,11,.62);--landing-line:rgba(9,10,11,.22)}
.landing-rock{background-image:url(${Sr});background-position:center top;background-size:cover;filter:brightness(.7) saturate(.74);height:1001px;inset:0 0 auto;mask-image:radial-gradient(ellipse 62% 43% at 50% 50%,#000 0 74%,transparent 100%);opacity:.86;pointer-events:none;position:absolute}
.landing-shell.is-light .landing-rock{background-image:url(${xr});filter:brightness(.96) saturate(.55) contrast(.92);opacity:.9}
.landing-shell::before{background:radial-gradient(ellipse 70% 44% at 50% 34%,rgba(249,249,150,.12),transparent 70%),linear-gradient(180deg,rgba(9,9,11,.12),rgba(9,9,11,.64) 88%);content:"";inset:0;pointer-events:none;position:absolute}
.landing-shell.is-light::before{background:radial-gradient(ellipse 70% 44% at 50% 34%,rgba(249,249,150,.14),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.3) 88%)}
.landing-shell::after{background-image:radial-gradient(rgba(255,255,255,.12) .7px,transparent .7px);background-size:4px 4px;content:"";inset:0;mix-blend-mode:soft-light;opacity:.14;pointer-events:none;position:absolute}
.landing-shell.is-light::after{background-image:radial-gradient(rgba(9,10,11,.1) .7px,transparent .7px);mix-blend-mode:multiply;opacity:.1}
.landing-wordmark{height:auto;left:50%;max-width:none;opacity:1;pointer-events:none;position:absolute;top:242px;transform:translateX(-59.2%);width:4300.87px;z-index:0}
.landing-shell.is-light .landing-wordmark{opacity:.9}
.landing-vignette{background:radial-gradient(ellipse 78% 66% at 50% 42%,transparent 0 34%,rgba(0,0,0,.28) 63%,rgba(0,0,0,.72) 100%);inset:0;pointer-events:none;position:absolute;z-index:1}
.landing-shell.is-light .landing-vignette{background:radial-gradient(ellipse 78% 66% at 50% 42%,transparent 0 20%,rgba(255,255,255,.4) 63%,rgba(255,255,255,.92) 100%)}
.landing-content{margin:0 auto;max-width:1200px;padding:0 0 4rem;position:relative;z-index:2}
.landing-header{height:auto;margin:0 auto;max-width:480px;min-height:197px;padding:36px 0 0;position:relative}
.landing-logo{height:66px;left:-19px;position:absolute;top:-15px;width:84px}
.landing-header-top{align-items:flex-start;display:flex;height:auto;justify-content:space-between;min-height:79px;width:480px}
.landing-title{color:var(--landing-ink);font-family:"Instrument Serif",Georgia,serif;font-size:40px;font-weight:400;letter-spacing:-.02em;line-height:42px;margin:0;width:188px}
.landing-header-side{align-items:flex-end;display:flex;flex-direction:column;justify-content:space-between;row-gap:14px}
.landing-copy{color:var(--landing-muted);font-size:12px;line-height:15px;margin:0;max-width:245px;padding-top:2px;text-align:right;width:245px}
.landing-control{align-items:center;display:flex;gap:20px;height:34px;justify-content:flex-start;margin:0;width:245px}
.landing-label{color:var(--landing-muted);font-size:12px;letter-spacing:.24em;line-height:16px;text-align:right;text-transform:uppercase;width:98px}
.landing-toggle-group{align-items:center;display:flex;gap:8px;height:32px;width:127px}
.landing-toggle{align-items:center;background:transparent;border:1px solid rgba(120,121,130,.2);border-radius:4px;color:var(--landing-muted);display:inline-flex;font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;height:32px;justify-content:center;letter-spacing:.02em;padding:6px 12px;text-transform:uppercase;transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease}
.landing-toggle:first-child{width:56px}
.landing-toggle:last-child{width:63px}
.landing-toggle:hover,.landing-toggle:focus-visible{border-color:var(--landing-ink);color:var(--landing-ink)}
.landing-toggle:disabled{cursor:default;opacity:1}
.landing-toggle.is-active{background:rgba(30,31,39,.8);border-color:rgba(120,121,130,.1);color:#f9fafa;text-shadow:0 0 20px rgba(255,255,255,.4)}
.landing-shell.is-light .landing-toggle.is-active{background:rgba(249,249,251,.14);border-color:rgba(30,31,39,.22);color:var(--landing-ink);text-shadow:none}
.landing-shell.is-light .landing-toggle:not(.is-active){background:rgba(30,31,39,.78);border-color:rgba(30,31,39,.1);color:#f9fafa}
.landing-shell:not(.is-light) .landing-toggle.is-active{background:rgba(30,31,39,.22);border-color:rgba(120,121,130,.1);color:#f9fafa;text-shadow:none}
.landing-shell:not(.is-light) .landing-toggle:not(.is-active){background:rgba(249,249,251,.78);border-color:rgba(249,249,251,.18);color:#090a0b}
.landing-header-divider{border:0;border-top:1px solid var(--landing-line);margin:15px 0 13px}
.landing-status{align-items:center;display:flex;justify-content:space-between}
.landing-status span{color:#eaeaeb;font:600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;text-transform:uppercase}
.landing-status span:last-child{align-items:center;display:inline-flex;gap:7px}
.landing-status span:last-child{color:#f9f996;font-weight:400}
.landing-status span:last-child::before{display:none}
.landing-shell.is-light .landing-status span{color:#090a0b}
.landing-shell.is-light .landing-status span:last-child{color:#4d4b00}
.landing-mark{display:block;height:66px;left:calc(50% - 259px);pointer-events:none;position:fixed;top:-8px;width:84px;z-index:100}
.landing-mark img{display:block;height:66px;width:84px}
.landing-stage{margin-top:0;position:relative}
.landing-reopen{background:transparent;border:1px solid var(--landing-line);color:var(--landing-ink);font-size:11px;letter-spacing:.08em;margin:18px auto 0;min-height:34px;padding:0 14px;text-transform:uppercase}
.landing-reopen:hover,.landing-reopen:focus-visible{background:var(--landing-ink);color:var(--landing-bg)}
.landing-stage .spray-paint-root.is-inline .spray-paint-frame{backdrop-filter:blur(var(--spray-glass-blur,16px)) saturate(.82);background:linear-gradient(180deg,rgba(30,31,39,.11),rgba(4,5,6,.2) 72.711%) padding-box,linear-gradient(180deg,rgba(255,255,255,.28),rgba(120,121,130,.22)) border-box;box-shadow:none;height:min(800px,75vw);max-height:800px}
.landing-shell.is-light .landing-stage .spray-paint-root.is-inline .spray-paint-frame{backdrop-filter:blur(var(--spray-glass-blur,16px)) saturate(.82);background:linear-gradient(180deg,rgba(30,31,39,.16) 0%,rgba(4,5,6,.24) 100%) padding-box,linear-gradient(180deg,rgba(255,255,255,.28),rgba(120,121,130,.22)) border-box;box-shadow:none}
.landing-shell .landing-stage .spray-paint-root.is-inline.is-glass .spray-paint-frame{backdrop-filter:saturate(.96) var(--spray-glass-filter);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(30,31,39,.14)) padding-box}
.landing-shell.is-light .landing-stage .spray-paint-root.is-inline.is-glass .spray-paint-frame{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(30,31,39,.16)) padding-box}
@media (max-height:1080px) and (min-width:721px){.landing-stage .spray-paint-root.is-inline .spray-paint-frame{height:min(800px,75vw,max(320px,calc(100dvh - 300px)))}}
@media(max-width:1260px){.landing-content{padding-inline:20px}}
@media(max-width:720px){.landing-content{padding-inline:14px}.landing-header{height:auto;min-height:222px;padding-top:28px}.landing-header-top{display:block;height:auto;min-height:0;padding-top:0;width:auto}.landing-header-side{align-items:flex-start;display:block;height:auto;width:auto}.landing-title{max-width:210px}.landing-copy{margin-top:16px;text-align:left;width:auto}.landing-control{justify-content:flex-start;margin-top:18px}.landing-mark{height:52px;left:max(14px,calc(50% - 254px));right:auto;top:-8px;width:66px}.landing-mark img{height:52px;width:66px}.landing-header-divider{margin-top:20px}.landing-stage{margin-top:24px}.landing-wordmark{top:360px}.landing-status{gap:12px}.landing-status span{font-size:9px}}
@media(prefers-reduced-motion:reduce){.landing-shell,.landing-toggle{transition:none}}
