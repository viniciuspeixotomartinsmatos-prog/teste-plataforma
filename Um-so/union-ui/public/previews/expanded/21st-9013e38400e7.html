.ims-shell *, .ims-shell *::before, .ims-shell *::after{box-sizing:border-box}
.ims-shell::before,.ims-shell::after{content:"";position:absolute;z-index:-2;pointer-events:none;border-radius:50%;filter:blur(.2px)}
.ims-shell::before{width:64vw;height:64vw;max-width:880px;max-height:880px;left:-34vw;top:-46vw;background:linear-gradient(145deg,#dbe9ff,#c7dcfb)}
.ims-shell::after{width:420px;height:680px;right:-260px;bottom:-310px;background:linear-gradient(140deg,#dceaff,#f1f6ff);transform:rotate(17deg)}
.ims-shell :is(button,input):focus-visible{outline:3px solid #9eb9ff;outline-offset:4px}
.ims-stage{position:relative;min-width:0;min-height:520px;display:grid;place-items:center}
.ims-fox{position:relative;width:100%;height:min(560px,66vh);min-height:360px}
.ims-fox-canvas{position:absolute;inset:0;opacity:0;transition:opacity 360ms ease}
.ims-fox-canvas.is-ready{opacity:1}
.ims-fox-canvas canvas{display:block;width:100%;height:100%;pointer-events:none}
.ims-fox-ground{position:absolute;width:48%;height:6%;left:26%;bottom:5%;border-radius:50%;background:#9db7eb42;filter:blur(14px)}
.ims-fox-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 360ms ease}
.ims-fox-poster.is-visible{opacity:1}
.ims-card{width:min(100%,520px);justify-self:center;padding:clamp(30px,4vw,52px);border:1px solid #fff;border-radius:30px;background:var(--surface);box-shadow:0 28px 90px #a4bceb30;backdrop-filter:blur(14px)}
.ims-card h1{margin:0 0 34px;font-size:clamp(32px,4.3vw,50px);line-height:1.03;letter-spacing:-.055em;font-weight:650}
.ims-card p{margin:0}
.ims-form{display:grid;gap:21px}
.ims-field label{display:flex;justify-content:space-between;gap:8px;margin-bottom:9px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.01em}
.ims-input-wrap{position:relative;display:flex;align-items:center}
.ims-input-wrap>svg{position:absolute;left:16px;width:19px;height:19px;color:#6f82ab;pointer-events:none;stroke-width:1.7}
.ims-input-wrap input,.ims-code{appearance:none;width:100%;height:56px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#243657;padding:0 16px 0 48px;font:inherit;font-size:16px;transition:border-color 160ms ease,box-shadow 160ms ease}
.ims-input-wrap input::placeholder,.ims-code::placeholder{color:#9ba8c2;font-size:14px}
.ims-input-wrap input:focus,.ims-code:focus{outline:none;border-color:#86a8fa;box-shadow:0 0 0 4px #779ae812}
.ims-input-wrap input[name=password]{padding-right:52px}
.ims-reveal{position:absolute;right:5px;width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#8295bc;cursor:pointer}
.ims-reveal:hover{background:#f3f6ff;color:#5570ad}
.ims-reveal svg{width:19px;height:19px;stroke-width:1.7}
.ims-submit{min-height:58px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:14px;border:0;border-radius:14px;background:linear-gradient(110deg,var(--accent-2),var(--accent));color:#fff;font:inherit;font-size:16px;font-weight:650;box-shadow:0 14px 28px #4c77f43b,inset 0 1px 2px #ffffff52;cursor:pointer;transition:transform 180ms ease,box-shadow 180ms ease}
.ims-submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 18px 32px #4c77f450,inset 0 1px 2px #ffffff52}
.ims-submit:active:not(:disabled){transform:translateY(1px)}
.ims-submit:disabled{opacity:.64;cursor:wait}
.ims-submit svg{width:19px;height:19px}
.ims-code{height:66px;padding:0 18px;text-align:center;letter-spacing:.42em;font-size:26px;font-variant-numeric:tabular-nums}
.ims-code::placeholder{font-size:26px;color:#c5cede}
.ims-hint{margin-top:10px!important;color:#8894ad;font-size:12px}
.ims-error{border:1px solid #f0d6d6;border-radius:9px;padding:11px 12px;background:#fff6f5;color:#a94444;font-size:13px;line-height:1.5}
.ims-back{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:0;border-radius:8px;background:transparent;color:#7e879b;font:inherit;font-size:12px;cursor:pointer}
.ims-back:hover{background:#f2f5fa;color:#46669e}
.ims-success{display:grid;gap:16px}
.ims-success-mark{display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:#e7f7ed;color:#37a56c;font-size:27px}
.ims-success p{color:var(--muted);font-size:14px;line-height:1.6}
@media(max-width:900px){.ims-shell{grid-template-columns:minmax(0,1fr);padding:34px 24px;gap:10px}.ims-stage{min-height:340px}.ims-fox{height:360px}.ims-card{justify-self:stretch;margin:auto;max-width:560px}}
@media(max-width:560px){.ims-shell{min-height:0;border-radius:24px;padding:25px 16px 30px}.ims-stage{min-height:260px}.ims-fox{height:280px;min-height:240px}.ims-card{padding:27px 22px 30px;border-radius:24px}.ims-card h1{font-size:35px;margin-bottom:27px}.ims-form{gap:18px}}
