.nap{--nap-bg:#fff;--nap-fg:#18181b;--nap-muted:#f4f4f5;--nap-muted-fg:#71717a;--nap-border:#e4e4e7;--nap-ring:#18181b;
  width:100%;box-sizing:border-box;overflow:hidden;border:1px solid var(--nap-border);border-radius:12px;

@media (prefers-color-scheme:dark){.nap[data-theme=system]{${x5}}}
.nap *,.nap *::before,.nap *::after{box-sizing:border-box}
.nap button,.nap input{font:inherit;color:inherit;margin:0}
.nap button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
.nap h3,.nap p{margin:0}
.nap :focus-visible{outline:2px solid var(--nap-ring);outline-offset:1px}
.nap-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--nap-border)}
.nap-crumbs{display:flex;align-items:center;gap:6px;min-width:0}
.nap .nap-crumb{border-radius:4px;padding:2px 4px;color:var(--nap-muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.nap .nap-crumb:hover{color:var(--nap-fg)}
.nap .nap-crumb[aria-current]{color:var(--nap-fg);font-weight:600}
.nap-chev{width:14px;height:14px;flex-shrink:0;color:var(--nap-muted-fg);opacity:.6}
.nap-inline{display:flex;align-items:center;gap:8px}
.nap-label{color:var(--nap-muted-fg)}
.nap .nap-input{height:36px;border:1px solid var(--nap-border);border-radius:6px;background:var(--nap-bg);padding:0 12px;outline:none;min-width:0}
.nap .nap-input::placeholder{color:var(--nap-muted-fg);opacity:.6}
.nap .nap-input:focus-visible{outline:2px solid var(--nap-ring);outline-offset:0}
.nap .nap-postal{width:96px;font-variant-numeric:tabular-nums;letter-spacing:.05em}
.nap-body{display:grid}
.nap-map{position:relative;display:flex;align-items:center;border-bottom:1px solid var(--nap-border)}
.nap-svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.nap-zoom{transition:transform 700ms cubic-bezier(.22,.8,.24,1)}
.nap-region{cursor:pointer;transition:fill-opacity .3s}
.nap-readout{pointer-events:none;position:absolute;left:12px;top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.nap-chip{display:flex;align-items:baseline;gap:8px;border:1px solid var(--nap-border);border-radius:6px;padding:4px 8px;
  background:color-mix(in srgb,var(--nap-bg) 90%,transparent);backdrop-filter:blur(6px);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nap-chip-status{font-size:12px;color:var(--nap-muted-fg)}
.nap .nap-inset{position:absolute;left:12px;bottom:12px;width:96px;padding:6px;border:1px solid var(--nap-border);border-radius:6px;
  background:color-mix(in srgb,var(--nap-bg) 90%,transparent);backdrop-filter:blur(6px);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nap .nap-inset:hover{background:var(--nap-bg)}
.nap-inset svg{display:block;width:100%;height:auto}
.nap-list{display:flex;flex-direction:column;min-height:0;max-height:18rem}
.nap-list-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 16px 8px}
.nap-list-head h3{font-size:14px;font-weight:600}
.nap-ul{list-style:none;margin:0;padding:0 8px 8px;flex:1;min-height:0;overflow-y:auto}
.nap .nap-item{position:relative;display:flex;width:100%;align-items:center;gap:12px;border-radius:6px;padding:6px 12px;transition:background .15s}
.nap .nap-item.nap-item-lg{padding:8px}
.nap .nap-item:hover,.nap .nap-item[aria-pressed=true]{background:var(--nap-muted)}
.nap .nap-item[aria-pressed=true]{font-weight:500}
.nap-swatch{width:12px;height:12px;border-radius:999px;flex-shrink:0}
.nap-bar{position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:999px}
.nap-grow{flex:1;min-width:0}
.nap-trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nap-block{display:block}
.nap-strong{font-weight:500}
.nap-sub{font-size:12px;font-weight:400;color:var(--nap-muted-fg)}
.nap-num{flex-shrink:0;font-size:12px;color:var(--nap-muted-fg);font-variant-numeric:tabular-nums}
.nap-footer{display:grid;gap:12px;padding:12px 16px;border-top:1px solid var(--nap-border)}
.nap-field{display:grid;gap:6px}
.nap-result{display:flex;align-items:center;gap:8px;min-height:36px;border-radius:6px;background:var(--nap-muted);padding:8px 12px}
.nap-result p{flex:1;min-width:0}
.nap-result .nap-empty{color:var(--nap-muted-fg)}
.nap .nap-btn{flex-shrink:0;border:1px solid var(--nap-border);border-radius:6px;background:var(--nap-bg);padding:4px 10px;font-size:12px;font-weight:500;transition:background .15s}
.nap .nap-btn:hover{background:var(--nap-muted)}
.nap-fill-muted{fill:var(--nap-muted-fg)}
.nap-fill-muted-soft{fill:var(--nap-muted-fg);fill-opacity:.3}
.nap-stroke-bg{stroke:var(--nap-bg)}
.nap-stroke-fg{stroke:var(--nap-fg)}
.nap-stroke-fg-soft{stroke:var(--nap-fg);stroke-opacity:.7}
.nap-text{fill:var(--nap-fg);stroke:var(--nap-bg)}
.nap-text-sub{fill:var(--nap-muted-fg)}
.nap-landmark{fill:var(--nap-muted-fg);font-style:italic}
.nap-landmark-dot{fill:var(--nap-fg);stroke:var(--nap-bg)}
@media (min-width:640px){
  .nap .nap-inset{width:128px}
  .nap-footer{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:end}
}
@media (min-width:768px){
  .nap-body{grid-template-columns:minmax(0,1fr) 17rem}
  .nap-map{border-bottom:0;border-right:1px solid var(--nap-border)}
  .nap-list{max-height:34rem}
}
@media (prefers-reduced-motion:reduce){.nap-zoom,.nap-region{transition:none}}
