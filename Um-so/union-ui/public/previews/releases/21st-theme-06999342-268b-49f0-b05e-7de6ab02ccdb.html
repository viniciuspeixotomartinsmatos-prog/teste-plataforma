<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vivid</title><style>:root {
  --background: #FFF9F6;
  --foreground: #5C4B43;
  --card: #FFFFFF;
  --card-foreground: #5C4B43;
  --popover: #FFFFFF;
  --popover-foreground: #5C4B43;
  --primary: #f081a2;
  --primary-foreground: #FFFFFF;
  --secondary: #f3ece7;
  --secondary-foreground: #5C4B43;
  --muted: #FAF3F0;
  --muted-foreground: #A18E84;
  --accent: #ad566c;
  --accent-foreground: #B33E5D;
  --destructive: #E5484D;
  --destructive-foreground: #FDFCFD;
  --border: #ddccc3;
  --input: #ebe0db;
  --ring: #f2799d;
  --chart-1: #FF7EA5;
  --chart-2: #B33E5D;
  --chart-3: #D4A59A;
  --chart-4: #F4C4C2;
  --chart-5: #E8D5D0;
  --radius: 0.5rem;
  --sidebar: #FCF7F5;
  --sidebar-foreground: #5C4B43;
  --sidebar-primary: #FF7EA5;
  --sidebar-primary-foreground: #FFFFFF;
  --sidebar-accent: #FFDBE4;
  --sidebar-accent-foreground: #B33E5D;
  --sidebar-border: #F0E4DE;
  --sidebar-ring: #FF7EA5;
  --font-sans: Quicksand, sans-serif;
  --font-serif: Cardo, serif;
  --font-mono: ui-monospace, SFMono-Regular, monospace;
  --shadow-color: #ffc3c3;
  --shadow-opacity: 0.4;
  --shadow-blur: 31px;
  --shadow-spread: -5px;
  --shadow-offset-x: 0px;
  --shadow-offset-y: 0px;
  --letter-spacing: -0.04em;
  --spacing: 0.25rem;
}

.dark {
  --background: #1A1412;
  --foreground: #EAE0DC;
  --card: #241D1A;
  --card-foreground: #EAE0DC;
  --popover: #241D1A;
  --popover-foreground: #EAE0DC;
  --primary: #FF7EA5;
  --primary-foreground: #1A1412;
  --secondary: #2D2421;
  --secondary-foreground: #EAE0DC;
  --muted: #2D2421;
  --muted-foreground: #A18E84;
  --accent: #3D252A;
  --accent-foreground: #FFB3C6;
  --destructive: #E5484D;
  --destructive-foreground: #FDFCFD;
  --border: #332A26;
  --input: #332A26;
  --ring: #FF7EA5;
  --chart-1: #FF7EA5;
  --chart-2: #FFB3C6;
  --chart-3: #D4A59A;
  --chart-4: #5C4B43;
  --chart-5: #332A26;
  --radius: 0.5rem;
  --sidebar: #140F0D;
  --sidebar-foreground: #EAE0DC;
  --sidebar-primary: #FF7EA5;
  --sidebar-primary-foreground: #1A1412;
  --sidebar-accent: #3D252A;
  --sidebar-accent-foreground: #FFB3C6;
  --sidebar-border: #2D2421;
  --sidebar-ring: #FF7EA5;
  --font-sans: Inter, system-ui, sans-serif;
  --font-serif: Georgia, serif;
  --font-mono: JetBrains Mono, monospace;
  --shadow-color: hsl(0 0% 0%);
  --shadow-opacity: 0.3;
  --shadow-blur: 15px;
  --shadow-spread: 0px;
  --shadow-offset-x: 0px;
  --shadow-offset-y: 4px;
  --letter-spacing: -0.01em;
  --spacing: 0.25rem;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-radius: var(--radius);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);
  --color-font-sans: var(--font-sans);
  --color-font-serif: var(--font-serif);
  --color-font-mono: var(--font-mono);
  --color-shadow-color: var(--shadow-color);
  --color-shadow-opacity: var(--shadow-opacity);
  --color-shadow-blur: var(--shadow-blur);
  --color-shadow-spread: var(--shadow-spread);
  --color-shadow-offset-x: var(--shadow-offset-x);
  --color-shadow-offset-y: var(--shadow-offset-y);
  --color-letter-spacing: var(--letter-spacing);
  --color-spacing: var(--spacing);
}</style><style>*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans,system-ui);padding:clamp(18px,5vw,64px)}main{max-width:920px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:38px}h1{font-size:38px;margin:8px 0;letter-spacing:-.04em}p{line-height:1.6}small{color:var(--muted-foreground)}section{border:1px solid var(--border);border-radius:var(--radius,12px);background:var(--card);color:var(--card-foreground);padding:26px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.swatches{display:flex;gap:10px;margin:24px 0}.swatches i{width:48px;height:48px;border-radius:var(--radius,8px);border:1px solid var(--border)}button,input,select{font:inherit;border-radius:var(--radius,8px);padding:12px 16px;border:1px solid var(--border)}button{cursor:pointer;background:var(--primary);color:var(--primary-foreground)}button.secondary{background:var(--secondary);color:var(--secondary-foreground)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ring);outline-offset:3px}label{display:flex;flex-direction:column;gap:8px;margin:20px 0}input,select{width:100%;background:var(--background);color:var(--foreground)}.actions{display:flex;gap:10px;flex-wrap:wrap}output{display:block;margin-top:15px;color:var(--muted-foreground)}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:28px}header{align-items:flex-start}}</style></head><body><main><header><div><small>CORES E TIPOGRAFIA</small><h1>Vivid</h1><p>Experimente os tokens deste tema.</p></div><button class="secondary" id="theme" aria-pressed="false">Alternar tema</button></header><div class="grid"><section><h2>Seu próximo projeto</h2><p>Uma paleta aplicada a elementos reais da interface.</p><div class="swatches" aria-label="Cores do tema"><i style="background:var(--primary)"></i><i style="background:var(--secondary)"></i><i style="background:var(--accent)"></i><i style="background:var(--destructive)"></i></div><label>Nome do projeto<input placeholder="Minha próxima ideia"></label><label>Categoria<select><option>Aplicativo</option><option>Portfólio</option><option>Loja</option></select></label><div class="actions"><button id="save">Salvar projeto</button><button class="secondary" id="reset">Limpar</button></div><output id="status" aria-live="polite"></output></section><section><h2>Configurações</h2><p>Ajuste as opções e confira o contraste da paleta.</p><label>Notificações<input type="checkbox" checked></label><label>Intensidade<input type="range" min="0" max="100" value="65"></label><p>Texto de apoio e estados de foco usam os tokens originais.</p></section></div></main><script>document.querySelector('#theme').onclick=e=>{const dark=document.documentElement.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',String(dark))};document.querySelector('#save').onclick=()=>document.querySelector('#status').textContent='Projeto salvo nesta demonstração.';document.querySelector('#reset').onclick=()=>{document.querySelector('input').value='';document.querySelector('#status').textContent='Campos limpos.'};</script></body></html>
