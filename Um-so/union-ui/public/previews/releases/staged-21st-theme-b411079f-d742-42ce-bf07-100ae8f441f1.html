<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orange Dark</title><style>:root {
  --background: #0c0a08;
  --foreground: #fafaf9;
  --card: rgba(255, 255, 255, 0.06);
  --card-foreground: #fafaf9;
  --popover: #17171b;
  --popover-foreground: #fafafa;
  --primary: #ffcc00;
  --primary-foreground: #1a0f05;
  --secondary: rgba(255, 255, 255, 0.09);
  --secondary-foreground: #fafaf9;
  --muted: rgba(255, 255, 255, 0.05);
  --muted-foreground: #a49c94;
  --accent: rgba(31, 170, 183, 0.18);
  --accent-foreground: #6ed6de;
  --destructive: oklch(0.704 0.191 22.216);
  --destructive-foreground: hsl(210 40% 98%);
  --border: rgba(255, 255, 255, 0.14);
  --input: rgba(255, 255, 255, 0.18);
  --ring: #f58c24;
  --chart-1: #f58c24;
  --chart-2: #1faab7;
  --chart-3: #f9a748;
  --chart-4: #0e6a81;
  --chart-5: #c8a96f;
  --radius: 1.2rem;
  --sidebar: #101013;
  --sidebar-foreground: #fafafa;
  --sidebar-primary: #e3af35;
  --sidebar-primary-foreground: #09090b;
  --sidebar-accent: #1c1c21;
  --sidebar-accent-foreground: #fafafa;
  --sidebar-border: rgba(255, 255, 255, 0.08);
  --sidebar-ring: #e3af35;
  --font-sans: DM Sans, sans-serif;
  --font-serif: ui-serif, Georgia, serif;
  --font-mono: Roboto Mono, monospace;
  --shadow-color: hsl(30 20% 4%);
  --shadow-opacity: 0.45;
  --shadow-blur: 40px;
  --shadow-spread: -12px;
  --shadow-offset-x: 0px;
  --shadow-offset-y: 20px;
  --letter-spacing: 0em;
  --spacing: 0.25rem;
}

.dark {
  --background: #f2f6f7;
  --foreground: #16120e;
  --card: rgba(255, 255, 255, 0.65);
  --card-foreground: #16120e;
  --popover: #17171b;
  --popover-foreground: #fafafa;
  --primary: #ffcc00;
  --primary-foreground: #1a0f05;
  --secondary: rgba(255, 255, 255, 0.75);
  --secondary-foreground: #16120e;
  --muted: rgba(22, 18, 14, 0.04);
  --muted-foreground: #57524c;
  --accent: rgba(26, 3, 86, 0.12);
  --accent-foreground: #000150;
  --destructive: oklch(0.704 0.191 22.216);
  --destructive-foreground: hsl(210 40% 98%);
  --border: rgba(21, 18, 14, 0.09);
  --input: rgba(21, 18, 14, 0.14);
  --ring: #f58c24;
  --chart-1: #f58c24;
  --chart-2: #0e8a95;
  --chart-3: #f9a748;
  --chart-4: #0b5065;
  --chart-5: #c8a96f;
  --radius: 1.2rem;
  --sidebar: #101013;
  --sidebar-foreground: #fafafa;
  --sidebar-primary: #e3af35;
  --sidebar-primary-foreground: #09090b;
  --sidebar-accent: #1c1c21;
  --sidebar-accent-foreground: #fafafa;
  --sidebar-border: rgba(255, 255, 255, 0.08);
  --sidebar-ring: #e3af35;
  --font-sans: DM Sans, sans-serif;
  --font-serif: ui-serif, Georgia, serif;
  --font-mono: ui-monospace, SFMono-Regular, monospace;
  --shadow-color: hsl(30 20% 4%);
  --shadow-opacity: 0.12;
  --shadow-blur: 40px;
  --shadow-spread: -12px;
  --shadow-offset-x: 0px;
  --shadow-offset-y: 20px;
  --letter-spacing: 0em;
  --spacing: 0.25rem;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-radius: var(--radius);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);
  --color-font-sans: var(--font-sans);
  --color-font-serif: var(--font-serif);
  --color-font-mono: var(--font-mono);
  --color-shadow-color: var(--shadow-color);
  --color-shadow-opacity: var(--shadow-opacity);
  --color-shadow-blur: var(--shadow-blur);
  --color-shadow-spread: var(--shadow-spread);
  --color-shadow-offset-x: var(--shadow-offset-x);
  --color-shadow-offset-y: var(--shadow-offset-y);
  --color-letter-spacing: var(--letter-spacing);
  --color-spacing: var(--spacing);
}</style><style>*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans,system-ui);padding:clamp(18px,5vw,64px)}main{max-width:920px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:38px}h1{font-size:38px;margin:8px 0;letter-spacing:-.04em}p{line-height:1.6}small{color:var(--muted-foreground)}section{border:1px solid var(--border);border-radius:var(--radius,12px);background:var(--card);color:var(--card-foreground);padding:26px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.swatches{display:flex;gap:10px;margin:24px 0}.swatches i{width:48px;height:48px;border-radius:var(--radius,8px);border:1px solid var(--border)}button,input,select{font:inherit;border-radius:var(--radius,8px);padding:12px 16px;border:1px solid var(--border)}button{cursor:pointer;background:var(--primary);color:var(--primary-foreground)}button.secondary{background:var(--secondary);color:var(--secondary-foreground)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ring);outline-offset:3px}label{display:flex;flex-direction:column;gap:8px;margin:20px 0}input,select{width:100%;background:var(--background);color:var(--foreground)}.actions{display:flex;gap:10px;flex-wrap:wrap}output{display:block;margin-top:15px;color:var(--muted-foreground)}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:28px}header{align-items:flex-start}}</style></head><body><main><header><div><small>CORES E TIPOGRAFIA</small><h1>Orange Dark</h1><p>Experimente os tokens deste tema.</p></div><button class="secondary" id="theme" aria-pressed="false">Alternar tema</button></header><div class="grid"><section><h2>Seu próximo projeto</h2><p>Uma paleta aplicada a elementos reais da interface.</p><div class="swatches" aria-label="Cores do tema"><i style="background:var(--primary)"></i><i style="background:var(--secondary)"></i><i style="background:var(--accent)"></i><i style="background:var(--destructive)"></i></div><label>Nome do projeto<input placeholder="Minha próxima ideia"></label><label>Categoria<select><option>Aplicativo</option><option>Portfólio</option><option>Loja</option></select></label><div class="actions"><button id="save">Salvar projeto</button><button class="secondary" id="reset">Limpar</button></div><output id="status" aria-live="polite"></output></section><section><h2>Configurações</h2><p>Ajuste as opções e confira o contraste da paleta.</p><label>Notificações<input type="checkbox" checked></label><label>Intensidade<input type="range" min="0" max="100" value="65"></label><p>Texto de apoio e estados de foco usam os tokens originais.</p></section></div></main><script>document.querySelector('#theme').onclick=e=>{const dark=document.documentElement.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',String(dark))};document.querySelector('#save').onclick=()=>document.querySelector('#status').textContent='Projeto salvo nesta demonstração.';document.querySelector('#reset').onclick=()=>{document.querySelector('input').value='';document.querySelector('#status').textContent='Campos limpos.'};</script></body></html>
