\`\`\`javascript
useEffect(() => {
  const fetchData = async () => {
    try {
      const response = await fetch('/api/data');
      const data = await response.json();
      setData(data);
    } catch (error) {
      setError(error);
    }
  };
  
  fetchData();
}, []);
\`\`\`

What's the **proper way** to handle this? Should I be using a cleanup function?

## Additional Context
* This happens when the user navigates away quickly
* I've read about *AbortController* but not sure how to implement it

> **Note**: I'm using React 18 with TypeScript`,author:{name:"reactnewbie",reputation:156,badges:{gold:0,silver:1,bronze:3}},tags:["javascript","reactjs","async-await","useeffect"],votes:23,views:1247,timestamp:"2 hours ago",bookmarked:!1,userVote:null},A1=[{id:1,content:`You're **absolutely right** to be concerned about memory leaks! The proper way to handle async operations in \`useEffect\` is to use a cleanup function with an **AbortController**.

## Method: AbortController (Recommended)
\`\`\`javascript
useEffect(() => {
  const controller = new AbortController();
  
  const fetchData = async () => {
    try {
      const response = await fetch('/api/data', {
        signal: controller.signal
      });
      const data = await response.json();
      setData(data);
    } catch (error) {
      if (error.name !== 'AbortError') {
        setError(error);
      }
    }
  };
  
  fetchData();
  
  return () => controller.abort();
}, []);
\`\`\`
