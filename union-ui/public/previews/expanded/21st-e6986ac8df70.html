        .resizable-navbar {

          align-items: center;

          box-sizing: border-box;
          min-width: 0;
          left: 0;
          right: 0;
          transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .navbar-logo {
          display: flex;
          align-items: center;
          gap: 10px;
          text-decoration: none;
          color: ${El};
          font-weight: 600;

          transition: color 0.2s;
        }

          color: ${xt};
        }
        .app-name {

          font-weight: 600;

          flex: 1 1 0;
          justify-content: center;

          text-decoration: none;

          position: relative;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          display: flex;
          align-items: center;
          transition: color 0.3s, background 0.3s, font-size 0.2s;
        }
        .nav-link:hover {
          background: ${bt};
          color: ${zt};
        }
        .nav-link .nav-link-text {
          width: 100%;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          transition: font-size 0.2s;
        }
        .navbar-search-btn {
          display: flex;
          align-items: center;
          gap: 10px;
          background: ${vl};
          color: ${Gl};
          border-radius: 8px;
          border: none;
          outline: 1px solid ${K};
          padding: 7px 16px 7px 12px;
          font-size: 1rem;
          cursor: pointer;
          min-width: 210px;
          transition: outline 0.2s, background 0.2s, color 0.2s;
          margin-left: auto;
        }
        .navbar-search-btn:hover {
          background: ${Vl};
          color: ${Ll};
        }
        .navbar-search-btn:active,
        .navbar-search-btn:focus {
          outline-width: 2px;
        }
        .search-placeholder {
          flex: 1;
          text-align: left;
          color: ${Sl};
          transition: color 0.3s;
          cursor: pointer;
        }
        .search-placeholder.hovered {
          color: ${zt};
        }
        .search-shortcut {
          display: flex;
          align-items: center;
          gap: 2px;
          margin-left: 10px;
          font-size: 14.4px;
          border-radius: 8px;
          padding: 2px 7px;
          outline: 1px solid ${K};
          background: ${vl};
          transition: outline 0.2s, background 0.2s;
        }
        .search-shortcut svg {
          border-radius: 6px;
          margin-right: 2px;
        }
        .search-shortcut span:last-child {
          color: ${Gl};
          margin-left: 2px;
        }
        .mobile-nav-toggle {
          display: none;
        }
        @media (max-width: 909px) {
          .nav-items {

          }
          .navbar-search-btn {

            display: block;

            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
          }
        }
        .mobile-nav-overlay {
          position: fixed;
          inset: 0;

          z-index: 100;
          animation: fade-in 0.2s;
          background: ${Xl};
          color: ${Kl};
        }
        .mobile-nav-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 2rem;
        }
        .mobile-nav-close {
          background: none;
          border: none;
          color: ${Kl};
          cursor: pointer;
          padding: 0 2px;
          transition: color 0.2s;
          display: flex;
          align-items: center;
        }

          gap: 1rem;
        }

          padding: 10px;
          border-radius: 6px;
          background: transparent;
          cursor: pointer;
          transition: background 0.15s;
          display: flex;
          flex-direction: column;
          gap: 2px;
          color: ${Kl};
          font-size: 1.1rem;
          text-decoration: none;
        }
        .mobile-nav-link:hover {
          background: ${Kt};
          color: ${it};
        }
        .navbar-search-btn.mobile {
          display: flex !important;
          width: 100%;
          margin-top: 10px;
        }

        .fade-leave-to {
