.lp-root * {
  box-sizing: border-box;
  scrollbar-width: none;
}
.lp-root *::-webkit-scrollbar {
  display: none;
}
.lp-root button,.lp-root input {
  font: inherit;
}
.lp-root button {
  background: none;
  border: 0;
  color: inherit;
  cursor: pointer;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.lp-root button:focus-visible,.lp-root input:focus-visible {
  outline: 2px solid #d1efaa;
  outline-offset: 5px;
}
.lp-root button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
.lp-root h1,.lp-root p {
  margin: 0;
}
.lp-root .sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.lp-root .comparison-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.lp-root .comparison-labels {
  display: flex;
  align-items: center;
  gap: 18px;
}
.lp-root .comparison-labels > button {
  min-height: 44px;
  display: flex;
  gap: 9px;
  align-items: center;
  font-size: 13px;
  color: #a5ae98;
  transition: color 0.2s;
}
.lp-root .comparison-labels > button > span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 19px;
  height: 19px;
  border: 1px solid #414c36;
  color: #7e906d;
  font:
    9px ui-monospace,
    monospace;
  transition:
    border-color 0.2s,
    color 0.2s;
}
.lp-root .comparison-labels > button:hover,.lp-root .comparison-labels > button.active {
  color: #f1f4ea;
}
.lp-root .comparison-labels > button.active > span {
  border-color: #b8d49b;
  color: #d9edbf;
}
.lp-root .comparison-labels > i {
  height: 13px;
  width: 1px;
  background: #3a442f;
}
.lp-root .angle-readout {
  font:
    25px ui-monospace,
    monospace;
  letter-spacing: -1.3px;
  color: #d4dfc5;
}
.lp-root .angle-readout sup {
  font-size: 12px;
  margin-left: 2px;
  color: #7f916d;
}
.lp-root .optical-stage {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  background: #23271e;
  cursor: ew-resize;
  touch-action: pan-y;
  user-select: none;
  contain: layout paint;
}
.lp-root .comparison-underlay,.lp-root .endpoint-image {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  user-select: none;
}
.lp-root .comparison-underlay {
  z-index: 0;
}
.lp-root .facets {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}
.lp-root .facet-window {
  position: absolute;
  top: 0;
  height: 100%;
  overflow: hidden;
  perspective: 850px;
  isolation: isolate;
}
.lp-root .facet-prism {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}
.lp-root .facet-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform-origin: center center;
  background-repeat: no-repeat;
  will-change: filter;
}
.lp-root .facet-face:after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-left: 1px solid #f6f7dd13;
  border-right: 1px solid #18241520;
}
.lp-root .endpoint-image {
  z-index: 2;
}
.lp-root .optical-edge {
  position: absolute;
  inset: 0;
  z-index: 5;
  border: 1px solid #ffffff0d;
  pointer-events: none;
}
.lp-root .comparison-controls {
  display: flex;
  align-items: center;
  gap: 17px;
  padding: 11px 0 12px;
  border-bottom: 1px solid #343c2c;
}
.lp-root .comparison-controls input {
  appearance: none;
  flex: 1;
  width: 100%;
  min-width: 0;
  height: 44px;
  background: transparent;
  cursor: ew-resize;
  margin: 0;
  touch-action: pan-y;
  accent-color: #d3e8b7;
}
.lp-root .comparison-controls input::-webkit-slider-runnable-track {
  height: 1px;
  background: #4b583f;
}
.lp-root .comparison-controls input::-webkit-slider-thumb {
  appearance: none;
  width: 29px;
  height: 15px;
  border-radius: 2px;
  background: #c9dfa8;
  border: 1px solid #e6f2d5;
  box-shadow:
    inset 0 0 0 4px #c9dfa8,
    inset 1px 0 #485b33;
  margin-top: -7px;
}
.lp-root .comparison-controls input::-moz-range-track {
  height: 1px;
  background: #4b583f;
}
.lp-root .comparison-controls input::-moz-range-thumb {
  width: 27px;
  height: 13px;
  border-radius: 2px;
  background: #c9dfa8;
  border: 1px solid #e6f2d5;
}
.lp-root .control-arrow {
  display: flex;
  align-items: center;
  color: #81946b;
}
.lp-root .control-hint {
  font:
    10px ui-monospace,
    monospace;
  color: #a2b68c;
  white-space: nowrap;
  margin-left: 15px;
}
.lp-root .image-loading {
  position: absolute;
  inset: 0;
  background: #23291ddb;
  color: #d8e8c5;
  z-index: 7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  backdrop-filter: blur(8px);
}
.lp-root .image-loading.error {
  flex-direction: column;
  gap: 15px;
}
.lp-root .image-loading button {
  padding: 11px 16px;
  border: 1px solid #8aa76b;
  min-height: 44px;
}
.lp-root .dragging .optical-stage {
  cursor: grabbing;
}
.lp-root .reduced .optical-stage {
  cursor: ew-resize;
}
@media (min-width: 1600px) {
  .lp-root .comparison-labels > button {
    font-size: 14px;
  }
}
@media (max-width: 1000px) {
  .lp-root .control-hint {
    font-size: 9px;
  }
}
@media (max-width: 700px) {
  .lp-root .comparison-toolbar {
    margin-bottom: 12px;
  }
  .lp-root .comparison-labels {
    gap: 13px;
  }
  .lp-root .comparison-labels > button {
    font-size: 12px;
    gap: 7px;
  }
  .lp-root .angle-readout {
    font-size: 22px;
  }
  .lp-root .comparison-controls {
    gap: 12px;
    padding: 8px 0;
  }
  .lp-root .control-hint {
    display: none;
  }
  .lp-root .facet-window {
    perspective: 550px;
  }
  .lp-root .control-arrow {
    color: #a2bb89;
  }
}
@media (max-width: 360px) {
  .lp-root .comparison-labels > button {
    font-size: 11px;
  }
  .lp-root .angle-readout {
    font-size: 20px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .lp-root *,.lp-root *:before,.lp-root *:after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  .lp-root .facet-prism,.lp-root .facet-face {
    will-change: auto;
  }
}

  border-color: #4b4f45;
  color: #93998a;

.lp-root .comparison-labels > button.active > span {
  border-color: #dde3d4;
  color: #f0f3e9;
}
.lp-root .comparison-labels > i {
  background: #41453b;
}
.lp-root .angle-readout {
  color: #e1e5d9;
}
.lp-root .angle-readout sup {
  color: #989e8d;
}
.lp-root .comparison-controls {
  border-color: #3a3e34;
}
.lp-root .comparison-controls input::-webkit-slider-runnable-track,.lp-root .comparison-controls input::-moz-range-track {
  background: #555b4b;
}
.lp-root .comparison-controls input::-webkit-slider-thumb {
  background: #e1e8d6;

  box-shadow: none;
}
.lp-root .comparison-controls input::-moz-range-thumb {
  background: #e1e8d6;
  border-color: #f2f6ec;
}
.lp-root .control-arrow {
  color: #adb7a0;
}
.lp-root .control-hint {
  color: #b2bba6;
}
.lp-root button:focus-visible,.lp-root input:focus-visible {
  outline-color: #e2ebd4;
}
/* Keep the complete optical interaction in a normal desktop viewport. */

}
.lp-root .comparison-controls {
  padding: 8px 0;
}

  transition: color 0.25s;

.lp-demo .preset-list > button.active {
  color: #e1eccf;
}
.lp-demo .preset-image {

  height: 44px;
  overflow: hidden;
  background: #343e29;

.lp-demo .preset-image:after {
