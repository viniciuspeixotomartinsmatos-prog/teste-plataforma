.fph {width:100%;min-width:0;container-type:inline-size;font-family:inherit;box-sizing:border-box}
.fph *, .fph *::before, .fph *::after {box-sizing:border-box}
.fph button,.fph a {font:inherit;-webkit-tap-highlight-color:transparent}
.fph button {cursor:pointer}
.fph :focus-visible {outline:2px solid var(--color-ring,currentColor);outline-offset:4px}
.fph__eyebrow {display:flex;align-items:center;gap:10px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px}
.fph__eyebrow::before {content:"";width:24px;height:2px;background:currentColor;flex-shrink:0}
.fph__header {display:grid;grid-template-columns:1.3fr 1fr;align-items:end;gap:40px}
.fph__title {margin:0;font-size:clamp(30px,5.2cqw,52px);line-height:1.08;letter-spacing:-.055em;font-weight:550;text-wrap:balance;max-width:18ch;overflow-wrap:anywhere}
.fph__intro {display:grid;gap:16px;justify-items:start}
.fph__description {margin:0;max-width:38ch;font-size:13px;line-height:1.7;text-wrap:pretty}
.fph__count {display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.045em}
.fph__count strong {font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
.fph__tabs {display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;border-bottom-width:1px;padding:5px 2px 18px;margin:28px -2px 28px;scroll-padding-inline:2px}
.fph__tab {display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;min-height:44px;padding:8px 14px 8px 9px;border:1px solid transparent;border-radius:12px;background:transparent;font-size:12px;transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.fph__tab:hover {background:color-mix(in srgb,currentColor 5%,transparent)}
.fph__tab[aria-selected=true] {border-color:inherit}
.fph__tab-number {display:grid;place-items:center;width:25px;height:25px;border-radius:8px;font-size:9px;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.fph__panel {display:grid;grid-template-columns:1.22fr 1fr;gap:36px;align-items:center;animation:fph-enter .4s cubic-bezier(.22,1,.36,1) both;min-width:0}
.fph__visual {position:relative;min-width:0;aspect-ratio:1.12;border:1px solid;border-color:inherit;border-radius:22px;overflow:hidden}
.fph__visual-content {height:100%;width:100%}
.fph__placeholder {height:100%;display:grid;place-items:center;padding:25px;font-size:clamp(28px,5cqw,46px);font-weight:550;letter-spacing:-.05em;background:linear-gradient(145deg,color-mix(in srgb,currentColor 5%,transparent),transparent)}
.fph__info {min-width:0;padding:6px 0}
.fph__meta {display:flex;align-items:center;gap:8px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;margin-bottom:17px;flex-wrap:wrap}
.fph__meta-separator {opacity:.4}
.fph__name {margin:0 0 16px;font-size:clamp(30px,4.7cqw,44px);font-weight:550;line-height:1.08;letter-spacing:-.055em;overflow-wrap:anywhere}
.fph__summary {margin:0;max-width:40ch;font-size:14px;line-height:1.7;text-wrap:pretty;overflow-wrap:anywhere}
.fph__services {display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 0;padding:0;list-style:none}
.fph__service {border:1px solid;border-color:inherit;border-radius:7px;padding:5px 8px;font-size:10px;line-height:1.4}
.fph__outcome {margin:23px 0 0;border-top-width:1px;padding-top:18px}
.fph__outcome-label {display:block;margin-bottom:6px;font-size:9px;letter-spacing:.13em;text-transform:uppercase}
.fph__outcome p {margin:0;max-width:38ch;font-size:12px;line-height:1.65}
.fph__action {display:inline-flex;align-items:center;justify-content:space-between;gap:26px;min-height:44px;margin-top:24px;padding:12px 16px;border:0;border-radius:11px;text-decoration:none;font-size:12px;font-weight:500;line-height:1.5;transition:opacity .2s,transform .2s}
.fph__action:hover {opacity:.87}
.fph__action svg {transition:transform .2s;flex-shrink:0}
.fph__action:hover svg {transform:translate(2px,-2px)}
.fph__action:active {transform:translateY(1px)}
.fph__empty {display:grid;justify-items:center;text-align:center;gap:7px;min-height:260px;align-content:center;border:1px dashed;border-color:inherit;border-radius:22px;margin-top:28px;padding:28px}
.fph__empty strong {font-size:17px;font-weight:550;letter-spacing:-.025em}
.fph__empty p {margin:0;font-size:12px;line-height:1.7}
@keyframes fph-enter {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@container (max-width:370px) {.fph__title{font-size:32px}.fph__tab{padding-right:11px;gap:7px}.fph__tabs{gap:2px}.fph__visual{aspect-ratio:1.1}.fph__name{font-size:32px}}
@media (prefers-reduced-motion:reduce) {.fph *, .fph *::before, .fph *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.fph-demo {width:100%;max-width:1000px;margin:0 auto;padding:clamp(20px,4vw,44px);box-sizing:border-box;font-family:inherit}
.fph-demo *, .fph-demo__dialog * {box-sizing:border-box}
.fph-demo__note {margin:24px 0 0;padding-top:16px;border-top-width:1px;font-size:10px;line-height:1.7}
.fph-demo__visual {position:relative;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;padding:clamp(20px,3cqw,30px);overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,currentColor 4%,transparent),transparent 75%)}
.fph-demo__visual::before {content:"";position:absolute;width:220px;height:220px;border:1px solid currentColor;border-radius:50%;opacity:.04;left:-90px;top:-110px;pointer-events:none}
.fph-demo__visual-label {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.fph-demo__visual-label strong {font-size:11px;font-weight:600;letter-spacing:-.025em;text-transform:none}
.fph-demo__window {position:relative;min-width:0;width:100%;border:1px solid;border-color:inherit;border-radius:12px;overflow:hidden;box-shadow:0 16px 32px -20px color-mix(in srgb,currentColor 20%,transparent);transform:rotate(-2deg)}
.fph-demo__window-head {display:flex;align-items:center;gap:4px;height:29px;padding:0 11px;border-bottom-width:1px}
.fph-demo__dot {width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.25}
.fph-demo__window-head span:last-child {margin-left:auto;font-size:7px;letter-spacing:.015em}
.fph-demo__product {display:grid;grid-template-columns:68px 1fr;min-height:198px}
.fph-demo__sidebar {border-right-width:1px;padding:13px 9px;font-size:7px;line-height:1.4}
.fph-demo__brand {display:block;margin-bottom:17px;font-size:9px;font-weight:650;letter-spacing:-.025em}
.fph-demo__nav {display:block;margin-top:8px;padding:5px 4px;border-radius:4px;white-space:nowrap}
.fph-demo__screen {min-width:0;padding:14px 12px}
.fph-demo__screen-title {display:block;font-size:11px;font-weight:550;letter-spacing:-.025em}
.fph-demo__screen-sub {display:block;margin-top:4px;font-size:7px;line-height:1.5}
.fph-demo__metric {margin-top:16px;padding:10px;border:1px solid;border-color:inherit;border-radius:7px}
.fph-demo__metric-head {display:flex;align-items:center;justify-content:space-between;font-size:7px}
.fph-demo__bars {display:flex;align-items:end;gap:5px;height:56px;margin-top:10px}
.fph-demo__bar {flex:1;min-width:0;border-radius:3px 3px 1px 1px}
.fph-demo__release {display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:11px;padding-top:9px;border-top-width:1px;font-size:7px}
.fph-demo__status {display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.fph-demo__status::before {content:"";width:3px;height:3px;background:currentColor;border-radius:50%}
.fph-demo__folio {padding:18px;min-height:224px}
.fph-demo__folio-top {display:flex;justify-content:space-between;align-items:center;font-size:7px}
.fph-demo__folio-title {margin:19px 0 12px;font-size:23px;font-weight:500;line-height:1.03;letter-spacing:-.06em;max-width:9ch}
.fph-demo__gallery {display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fph-demo__art {height:65px;border-radius:5px;overflow:hidden;position:relative;background:color-mix(in srgb,currentColor 8%,transparent)}
.fph-demo__art:first-child::before {content:"";position:absolute;inset:16px 22px;border-radius:50%;border:10px solid currentColor;opacity:.65;transform:rotate(-30deg)}
.fph-demo__art:last-child::before {content:"";position:absolute;inset:12px 23px;background:currentColor;opacity:.2;transform:rotate(-25deg);border-radius:2px}
.fph-demo__art-label {display:flex;justify-content:space-between;margin-top:6px;font-size:6px}
.fph-demo__relay {padding:17px 12px;min-height:224px}
.fph-demo__board {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:17px}
.fph-demo__column-label {font-size:6px;display:flex;justify-content:space-between;padding:0 2px 7px;white-space:nowrap}
.fph-demo__task {min-height:45px;margin-bottom:6px;border:1px solid;border-color:inherit;border-radius:5px;padding:7px 6px}
.fph-demo__task-label {display:block;font-size:6px;line-height:1.45}
.fph-demo__task-line {height:2px;width:70%;background:currentColor;opacity:.12;border-radius:2px;margin-top:8px}
.fph-demo__task-dot {display:block;width:7px;height:7px;border-radius:50%;margin-top:7px;background:currentColor;opacity:.22}
.fph-demo__visual-footer {display:flex;align-items:center;justify-content:space-between;margin-top:19px;font-size:7px;letter-spacing:.06em;text-transform:uppercase}
