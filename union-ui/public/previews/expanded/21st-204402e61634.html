.gradient-blinds-canvas {

.fcb-section {
  --cta-void: #050506;
  --cta-ink: #0a0a0b;
  --cta-paper: #f4f1ea;
  --cta-signal: #d0112b;
  --cta-signal-soft: color-mix(in srgb, var(--cta-signal) 72%, white);

  position: relative;
  z-index: 2;
  background: var(--cta-paper);
  color: var(--cta-ink);
  padding: clamp(3rem, 8vw, 5.5rem) var(--page-gutter, 1.25rem)
    clamp(4rem, 10vw, 6.5rem);
}

.fcb-banner {
  /* Type + spacing scale with the card itself */
  --cta-pad-y: clamp(1.1rem, 8cqh, 3.75rem);
  --cta-pad-x: clamp(1.15rem, 4.5cqw, 3.25rem);
  --cta-gap: clamp(0.45rem, 2.8cqh, 1rem);
  --cta-eyebrow: clamp(0.58rem, 1.35cqw, 0.68rem);
  --cta-heading: clamp(1.35rem, 4.6cqw + 1.2cqh, 3.35rem);
  --cta-body: clamp(0.82rem, 1.35cqw + 0.55cqh, 1.08rem);
  --cta-action: clamp(0.78rem, 1.2cqw + 0.4cqh, 0.92rem);
  --cta-btn-y: clamp(0.55rem, 2.2cqh, 0.85rem);
  --cta-btn-x: clamp(0.95rem, 2.8cqw, 1.35rem);

  position: relative;
  isolation: isolate;
  container-type: size;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  width: min(100%, 82rem);
  margin-inline: auto;
  aspect-ratio: 2.4 / 1;
  min-height: fit-content;
  padding: var(--cta-pad-y) var(--cta-pad-x);
  border-radius: clamp(0.9rem, 2.2cqw, 1.35rem);
  background: var(--cta-void);
  color: var(--cta-paper);
  box-shadow:
    0 1px 0 color-mix(in srgb, white 8%, transparent) inset,
    0 28px 56px -28px color-mix(in srgb, black 45%, transparent);
}

.fcb-blinds {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: auto;
  border-radius: inherit;
  overflow: hidden;
}

.fcb-blindsCanvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  display: block;
  mix-blend-mode: normal !important;
}

.fcb-scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  border-radius: inherit;
  background:
    linear-gradient(
      105deg,
      color-mix(in srgb, var(--cta-void) 72%, transparent) 0%,
      color-mix(in srgb, var(--cta-void) 38%, transparent) 42%,
      color-mix(in srgb, var(--cta-void) 18%, transparent) 100%
    ),
    radial-gradient(
      90% 80% at 78% 50%,
      color-mix(in srgb, var(--cta-signal) 22%, transparent),
      transparent 62%
    );
}

.fcb-copy {
  position: relative;
  z-index: 2;
  width: min(100%, 36rem);
  max-width: 58cqw;
  display: grid;
  gap: var(--cta-gap);
  pointer-events: none;
}

.fcb-copy a {
  pointer-events: auto;
}

.fcb-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.7rem;
  margin: 0;
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: var(--cta-eyebrow);
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--cta-paper) 62%, transparent);
}

.fcb-eyebrowRule {
  width: clamp(1rem, 3cqw, 1.6rem);
  height: 1px;
  background: color-mix(in srgb, var(--cta-signal) 70%, transparent);
}

.fcb-heading {
  margin: 0;
  max-width: 14ch;
  font-family: var(--font-display, Georgia, "Times New Roman", serif);
  font-size: var(--cta-heading);
  font-weight: 500;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--cta-paper);
  text-wrap: balance;
}

.fcb-body {
  margin: 0;
  max-width: 34ch;
  font-family: var(--font-body, system-ui, sans-serif);
  font-size: var(--cta-body);
  line-height: 1.45;
  color: color-mix(in srgb, var(--cta-paper) 72%, transparent);
}

.fcb-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: clamp(0.45rem, 2cqh, 0.85rem) clamp(0.65rem, 2cqw, 1.1rem);
  margin-top: clamp(0.2rem, 1.5cqh, 0.65rem);
}

.fcb-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: var(--cta-btn-y) var(--cta-btn-x);
  border-radius: 999px;
  background: var(--cta-signal);
  color: #fff;
  font-family: var(--font-body, system-ui, sans-serif);
  font-size: var(--cta-action);
  font-weight: 600;
  letter-spacing: 0.01em;
  text-decoration: none;
  box-shadow:
    0 1px 0 color-mix(in srgb, white 22%, transparent) inset,
    0 10px 28px -12px color-mix(in srgb, var(--cta-signal) 70%, transparent);
  transition:
    background 160ms ease,
    transform 160ms ease;
}

.fcb-primary:hover {
  background: color-mix(in srgb, var(--cta-signal) 88%, white);
  transform: translateY(-1px);
}

.fcb-primary:focus-visible {
  outline: 2px solid var(--cta-signal-soft);
  outline-offset: 3px;
}

.fcb-secondary {
  display: inline-flex;
  align-items: center;
  padding: calc(var(--cta-btn-y) * 0.85) 0.35rem;
  color: color-mix(in srgb, var(--cta-paper) 78%, transparent);
  font-family: var(--font-body, system-ui, sans-serif);
  font-size: var(--cta-action);
  font-weight: 500;
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--cta-paper) 28%, transparent);
  text-underline-offset: 0.28em;
  transition:
    color 160ms ease,
    text-decoration-color 160ms ease;
}

.fcb-secondary:hover {
  color: var(--cta-paper);
  text-decoration-color: color-mix(in srgb, var(--cta-paper) 55%, transparent);
}

.fcb-secondary:focus-visible {
  outline: 2px solid var(--cta-signal-soft);
  outline-offset: 3px;
  border-radius: 4px;
}

/* Short cards: tighten further so nothing clips */
@container (max-height: 22rem) {
  .fcb-eyebrow {
    letter-spacing: 0.12em;
  }

  .fcb-body {
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
}

@container (max-height: 16rem) {
  .fcb-eyebrow {
    display: none;
  }

  .fcb-body {
    -webkit-line-clamp: 1;
  }

  .fcb-actions {
    margin-top: 0;
  }
}

@media (max-width: 640px) {
  .fcb-banner {
    border-radius: 1.1rem;
    aspect-ratio: auto;
    min-height: 22rem;
    container-type: inline-size;
    --cta-heading: clamp(1.75rem, 8vw, 2.35rem);
    --cta-body: clamp(0.95rem, 3.2vw, 1.05rem);
    --cta-action: 0.9rem;
    --cta-pad-y: 2rem;
    --cta-pad-x: 1.35rem;
    --cta-gap: 0.85rem;
  }

  .fcb-copy {
    max-width: none;
  }

  .fcb-actions {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (prefers-reduced-motion: reduce) {
  .fcb-primary {
    transition: none;
  }

  .fcb-primary:hover {
    transform: none;
  }
}

.fcb-section {
  padding: 0;
}
