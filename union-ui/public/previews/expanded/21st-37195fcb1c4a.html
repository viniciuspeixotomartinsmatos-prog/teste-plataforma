error, and the ugly middle of a long list. Every project he leads gets a pass for those before it ships.</p><p>He's currently obsessed with reducing the gap between design files and shipped code, and spends a fair amount of time building small internal tools to close it.</p>",featuredImage:"https://cdn.21st.dev/assets/mirror/6d/6d08314779bd0f0add53695629c611517cfc9a29659879b7030cf9425376db3b.png",teams:{designation:"Design Director",linkedin:"https://www.linkedin.com"}},{id:"3",slug:"priya-menon",title:"Priya Menon",content:"<p>Priya builds the animation and interaction layer for every project, from scroll choreography to micro-interactions that make a page feel alive. Her rule of thumb: if you notice the animation before you notice what it's telling you, it's wrong.</p><p>She works closely with design from the earliest wireframes rather than being handed a finished comp to animate, which is why so much of the studio's motion work reads as intentional instead of decorative. Performance budgets are non-negotiable on her projects - nothing ships if it drops frames on a mid-range phone.</p><p>When she's not tuning easing curves, she's usually deep in a rabbit hole about how physical materials move, which somehow always ends up back in a spring config.</p>",featuredImage:"https://cdn.21st.dev/assets/mirror/52/521b1366e0e97702f3853ca34e44ec22afb0a6331932f938e3ab28afa7ace647.png",teams:{designation:"Lead Motion Engineer",linkedin:"https://www.linkedin.com"}},{id:"4",slug:"marcus-lindqvist",title:"Marcus Lindqvist",content:"<p>Marcus runs client relationships end to end, keeping ambitious timelines honest and every project shipping on schedule. He's the person who tells a client their launch date is unrealistic in week one, which tends to save everyone a much worse conversation in week eleven.</p><p>His background is split between agency production and a few years running operations at a small product company, so he understands both sides of the table - what a studio needs to do great work, and what a client actually needs to justify the spend internally.</p><p>He keeps every project's scope, budget, and timeline visible to the whole team at all times, on the theory that surprises are the only real project risk worth worrying about.</p>",featuredImage:"https://cdn.21st.dev/assets/mirror/0c/0c393afa742241b52395132efb49b1b10b6dcd16d54201e1852c82a35d91d83a.png",teams:{designation:"Producer",linkedin:"https://www.linkedin.com"}},{id:"5",slug:"sofia-almeida",title:"Sofia Almeida",content:"<p>Sofia writes the copy and content strategy behind every brand voice we ship, working closely with strategy and design from day one rather than being brought in at the end to fill placeholder text. That's usually the difference between a headline that fits the layout and one that fits the brand.</p><p>She's written for everything from three-person startups to companies going through a full rebrand, and has a particular interest in how a brand's voice needs to flex across a homepage, a support email, and an error message without losing its identity in any of them.</p><p>She also runs the studio's internal writing guidelines, which exist mostly so five different people don't invent five different ways to describe the same product feature.</p>",featuredImage:"https://cdn.21st.dev/assets/mirror/14/147057108e060ee8724a4179da79fe1043e9b979c41a1aa48f9af2efa886b94f.png",teams:{designation:"Content Lead",linkedin:"https://www.linkedin.com"}}];function _g({teams:_=mg,title:n="Built by Different Minds",description:r="A multidisciplinary team of designers, developers, strategists, and creative thinkers working together to turn ambitious ideas into thoughtful digital experiences. We bring different perspectives, skills, and creative energy to every project.",duration:u=.65,ease:c="power2.inOut",delay:o=0,backgroundColor:h="#ffffff",textColor:m="#111111",sidebarWidth:y="70%",overlayOpacity:v=.2,contentDuration:p=.25}){const[T,A]=te.useState(!1),[M,C]=te.useState(nul
