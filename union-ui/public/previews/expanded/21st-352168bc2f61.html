    .grainient-images-section {
      background: #000;
      color: #f0f0f0;
      overflow: clip;
    }
    .grainient-images-stage {
      height: 100vh;
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1;
      overflow: visible;
      perspective: 1200px;
    }
    .grainient-images-zoom {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .grainient-images-title {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      max-width: 392px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
      font-size: clamp(20px, 2.4vw, 34px);
      font-weight: 500;

      color: #f0f0f0;
      pointer-events: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .grainient-images-tile-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: visible;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%);
    }
    .grainient-images-tile-wrap--y-only {
      transform: translateY(-50%);
    }
    .grainient-images-tile {
      width: 100%;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      overflow: visible;
    }
    .grainient-images-tile img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: inherit;
