.tsb-root {
  --tsb-bg: var(--color-background, #ececec);
  --tsb-fg: var(--color-foreground, #1a1a1a);
  --tsb-tray: color-mix(in oklab, var(--tsb-fg) 9%, var(--tsb-bg));
  --tsb-edge: color-mix(in oklab, var(--tsb-fg) 24%, var(--tsb-bg));
  --tsb-tilt-x: 46deg;
  --tsb-tilt-z: -12deg;
  --tsb-rise: -22px;
  position: fixed;
  top: 50%;
  right: 36px;
  transform: translateY(-50%);
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
.tsb-root[hidden] { display: none; }

.tsb-stage {
  display: grid;
  place-items: center;
  perspective: 1200px;
  filter: blur(1.4px);
  opacity: 0.72;
  transition: filter 0.4s ease, opacity 0.4s ease;
}
.tsb-root[data-awake="true"] .tsb-stage { filter: none; opacity: 1; }

.tsb-tray {
  display: grid;
  grid-template-columns: repeat(var(--tsb-cols, 3), var(--tsb-tile, 30px));
  grid-auto-rows: var(--tsb-tile, 30px);
  gap: var(--tsb-gap, 5px);
  padding: var(--tsb-pad, 10px);
  background: var(--tsb-tray);
  border-radius: 10px;
  transform: translateY(var(--tsb-rise)) rotateX(var(--tsb-tilt-x)) rotateZ(var(--tsb-tilt-z));
  transform-style: preserve-3d;
  box-shadow: 0 9px 0 var(--tsb-edge), 0 22px 30px rgba(0, 0, 0, 0.16);
  cursor: pointer;
  touch-action: none;
  outline: none;
}
.tsb-tray:focus-visible {
  box-shadow:
    0 9px 0 var(--tsb-edge),
    0 0 0 3px var(--tsb-bg),
    0 0 0 5px var(--tsb-fg);
}
.tsb-root[data-dragging="true"] .tsb-tray { cursor: grabbing; }

.tsb-tile {
  --tsb-z: 7px;
  --tsb-h: 4px;
  --tsb-lift: 0px;
  --tsb-t: color-mix(in oklab, var(--tsb-fg) 18%, var(--tsb-bg));
  --tsb-s: color-mix(in oklab, var(--tsb-fg) 38%, var(--tsb-bg));
  position: relative;
  border-radius: 6px;
  background: var(--tsb-t);
  transform: translateZ(calc(var(--tsb-z) + var(--tsb-lift)));
  box-shadow:
    0 var(--tsb-h) 0 var(--tsb-s),
    0 calc(var(--tsb-h) * 2 + 2px) 6px rgba(0, 0, 0, 0.2);
  transition:
    transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
    box-shadow 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
    background-color 0.3s ease;
}
.tsb-tile[data-alt="true"] {
  --tsb-t: color-mix(in oklab, var(--tsb-fg) 27%, var(--tsb-bg));
  --tsb-s: color-mix(in oklab, var(--tsb-fg) 46%, var(--tsb-bg));
}
.tsb-tile[data-state="done"] {
  --tsb-z: 2px;
  --tsb-h: 1px;
  --tsb-t: color-mix(in oklab, var(--tsb-fg) 68%, var(--tsb-bg));
  --tsb-s: color-mix(in oklab, var(--tsb-fg) 82%, var(--tsb-bg));
}
.tsb-tile[data-state="done"][data-alt="true"] {
  --tsb-t: color-mix(in oklab, var(--tsb-fg) 56%, var(--tsb-bg));
  --tsb-s: color-mix(in oklab, var(--tsb-fg) 72%, var(--tsb-bg));
}
.tsb-tile[data-state="now"] {
  --tsb-z: 16px;
  --tsb-h: 8px;
  --tsb-s: var(--tsb-fg);
  background: linear-gradient(
    90deg,
    var(--tsb-fg) var(--tsb-fill, 0%),
    color-mix(in oklab, var(--tsb-fg) 78%, var(--tsb-bg)) var(--tsb-fill, 0%)
  );
}
.tsb-tile[data-hot="true"] { --tsb-lift: 10px; }

.tsb-tile[data-start="true"]::after {
  content: "";
  position: absolute;
  top: 6px;
  left: 6px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: color-mix(in oklab, var(--tsb-fg) 52%, var(--tsb-bg));
}
.tsb-tile[data-state="done"][data-start="true"]::after {
  background: color-mix(in oklab, var(--tsb-bg) 66%, var(--tsb-fg));
}
.tsb-tile[data-state="now"][data-start="true"]::after { background: var(--tsb-bg); }

.tsb-caption {
  position: relative;
  z-index: 1;
  margin: 6px 0 0;
  display: flex;
  gap: 0.5rem;
  font-size: 0.8125rem;
  font-weight: 500;
  line-height: 1.3;
  color: color-mix(in oklab, var(--tsb-fg) 58%, var(--tsb-bg));
  opacity: 0.7;
  transition: opacity 0.4s ease;
}
.tsb-root[data-awake="true"] .tsb-caption { opacity: 1; }
.tsb-caption-name { color: var(--tsb-fg); }
.tsb-caption-pct { font-variant-numeric: tabular-nums; }

.tsb-hint {
  /* Absolute, not in flow: in flow it pushes the tray off the centre line, and
     it only fades out, so the tray would sit high for the life of the page. */
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: max-content;
  max-width: 15rem;
  margin: 0;
  padding: 0.65rem 0.8rem;
  border-radius: 8px;
  background: color-mix(in oklab, var(--tsb-fg) 7%, var(--tsb-bg));
  color: var(--tsb-fg);
  font-size: 0.875rem;
  font-weight: 400;

  transition: opacity 0.4s ease;
}
.tsb-hint[data-gone="true"] { opacity: 0; pointer-events: none; }

.tsb-tip {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 41;
  display: flex;
  gap: 0.5rem;
  padding: 6px 9px;
  border-radius: 6px;
  background: var(--color-foreground, #1a1a1a);

  font-size: 0.8125rem;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease;

.tsb-tip[data-on="true"] { opacity: 1; }
.tsb-tip-pct {
  color: color-mix(in oklab, var(--color-background, #ececec) 62%, var(--color-foreground, #1a1a1a));

.tsb-root[data-compact="true"] .tsb-tile { border-radius: 4px; }

  text-align: center;
}

[data-tsb-hide-scrollbar] {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
[data-tsb-hide-scrollbar]::-webkit-scrollbar { display: none; }

@media (prefers-reduced-motion: reduce) {
  .tsb-stage,
  .tsb-tile,
  .tsb-caption,
  .tsb-tip,
  .tsb-hint {
    transition: none;
  }
}
`,cv=[{section:"Before you go",heading:"Before you go",body:["Everything here depends on the tide. Check the tide table for your stretch of coast and aim to arrive an hour or two before low water, then follow the sea out as it drops. The biggest tides of the month, the spring tides, fall around the new and full moon, and they uncover ground you won't otherwise see.","Wear shoes with grip that you don't mind soaking. Wet weed is slicker than ice, and barnacles will cut bare feet. Keep an eye on the water behind you as well as the pool in front of you: once the tide turns it can fill channels quickly and cut you off from the beach.","Bring a shallow white tray or a clear pot rather than a net. Nets tear delicate animals. A tray of seawater lets you look closely for a minute before putting everything back."]},{section:"Splash zone",heading:"The splash zone",body:["The top of the shore is barely sea at all. Waves only reach it in storms and at the highest tides, so the rocks here spend most of their lives dry, baked in summer and frozen in winter.","Look for lichens first. Bright orange-yellow patches sit highest, where only spray arrives. Below them the rock is often stained with a black crust that looks like spilled tar. It is also a lichen, and it marks roughly where the sea begins to reach regularly.","Run your fingers along the cracks and you may find small periwinkles, no bigger than a lentil. They can last for weeks out of water, sealed inside their shells behind a little door, waiting for the next big wave."]},{section:"Upper shore",heading:"The upper shore",body:["Barnacles cover the rocks here in rough grey crusts. It is hard to believe they are relatives of crabs and shrimps, but that is what they are: animals that glued themselves head-down to the rock as larvae and never moved again. When the tide covers them, the plates at the top open and feathery legs sweep the water for food.","Limpets share the same rocks. Each one grinds a shallow scar into the stone that fits its shell exactly, grazes the surrounding rock while the tide is in, and returns to the same spot before the water drops. Clamped onto its own scar, a limpet is almost impossible to shift, so leave them be.","The seaweed at this height is channel wrack, short and curled into little gutters that hold water. It can dry to a black crisp between tides and recover within minutes when the sea returns."]},{section:"Middle shore",heading:"The middle shore",body:["The middle of the shore is where the pools get interesting. Bladderwrack hangs from the rocks here, easy to recognise by the paired air pockets along its fronds that lift it toward the light when the tide is in.","Look in shaded pools and on damp rock for beadlet anemones. Out of water they pull in their tentacles and sit as glossy red blobs, like dropped jelly sweets. Underwater they open into a ring of tentacles, and around the top of the body you may spot a row of small blue beads. Those are for fighting: neighbouring anemones will push against each other over space.","Sit still at the edge of a pool for a few minutes before touching anything. Shrimps that are see-through in the light, gobies that match the gravel, and prawns that were invisible a moment ago all start moving once they decide you're part of the scenery."]},{section:"Lower shore",heading:"The lower shore",body:["The lowest band of the shore is only uncovered on the biggest tides, and it feels like a different place. Long brown kelp lies flat across the rocks, and underneath and around it the animals are larger and more varied.","Shore crabs are the ones you'll meet most, usually green, sometimes patterned, always ready to raise their claws. Pick one up from behind, with a finger and thumb on either side of the back of the shell, and it can't reach you. Edible crabs are the heavier, brick-red ones with a shell edge that looks like a pie crust.","Starfish tend to hide in damp gaps under weed. The common starfish is orange with five arms, though it is often missing one. Lost arms grow back over time."]},{section:"Turning stones",heading:"Turning stones",body:["Some of the richest life on the shore is under loose stones: brittlestars, porcelain crabs, sea squirts, and small fish guarding eggs. Turning stones is worth doing, but it needs care.","Lift each stone slowly and only as far as you need to see underneath. Look, then lower it back exactly as it was, the same way up, easing it down rather than dropping it so nothing gets crushed. A stone left upside down exposes the animals that need its dark, damp underside and smothers the ones living on top.","Never pull at anything attached. If something is stuck to a rock, it is meant to be."]},{section:"Leaving",heading:"Leaving it as you found it",body:["Before you go, put back everything you've collected. Return animals to the same pool, or the same patch of shore, that they came from. A tray left in the sun heats quickly, so keep visits short and the water fresh.","Take photographs rather than shells with animals in them, and let the tide have the last word. By the time it comes back in, the pool should look as though you were never there."]}];function fv(){return at.jsxs("div",{className:"bg-background text-foreground",children:[at.jsxs("main",{id:"rock-pool-guide",className:"mx-auto max-w-[34rem] px-6 pt-[18vh] pb-[45vh] font-serif text-[1.1875rem] leading-[1.65] md:mr-[240px] md:ml-[max(1.5rem,5vw)] xl:mx-auto",children:[at.jsxs("header",{children:[at.jsx("h1",{className:"mb-7 text-[clamp(2.75rem,8vw,5.25rem)] leading-[0.98] font-medium tracking-[-0.025em]",children:"Reading a rock pool"}),at.jsx("p",{className:"mb-[22vh] text-[1.375rem] leading-[1.45] text-muted-foreground",children:"What lives between the tides, from the dry rocks at the top of the beach to the kelp that only shows itself on the lowest tides."})]}),cv.map(z=>at.jsxs("section",{"data-section":z.section,className:"mt-22 first:mt-0",children:[at.jsx("h2",{className:"mb-4 text-[1.875rem
