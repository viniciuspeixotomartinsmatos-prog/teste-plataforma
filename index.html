<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Confirmação de envio" />
    <title>Obrigado</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap');

      :root {
        color-scheme: light;
        --ink: #1b2932;
        --paper: #f5f1e9;
        --coral: #ef715f;
        --aqua: #a7d9d2;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 14% 15%, #fff9dc 0 8%, transparent 8.2%),
          radial-gradient(circle at 86% 82%, var(--aqua) 0 13%, transparent 13.2%),
          var(--paper);
        color: var(--ink);
        display: flex;
        font-family: 'DM Mono', monospace;
        justify-content: center;
        margin: 0;
        min-height: 100svh;
        padding: 1.5rem;
      }

      main {
        border: 2px solid var(--ink);
        box-shadow: 10px 10px 0 var(--ink);
        max-width: 680px;
        overflow: hidden;
        width: 100%;
      }

      .stamp {
        background: var(--ink);
        color: var(--paper);
        font-size: .72rem;
        letter-spacing: .12em;
        padding: .85rem 1.15rem;
        text-transform: uppercase;
      }

      .content { padding: clamp(2rem, 7vw, 4.75rem); }

      .mark {
        align-items: center;
        background: var(--coral);
        border: 2px solid var(--ink);
        border-radius: 50%;
        display: flex;
        font-size: 2rem;
        font-weight: 700;
        height: 4rem;
        justify-content: center;
        margin-bottom: 2rem;
        transform: rotate(-8deg);
        width: 4rem;
      }

      h1 {
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(3rem, 11vw, 6.25rem);
        letter-spacing: -.07em;
        line-height: .85;
        margin: 0;
      }

      p {
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.65;
        margin: 2rem 0 2.5rem;
        max-width: 35rem;
      }

      a {
        background: var(--aqua);
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        color: var(--ink);
        display: inline-block;
        font-size: .83rem;
        font-weight: 500;
        letter-spacing: .04em;
        padding: 1rem 1.2rem;
        text-decoration: none;
        text-transform: uppercase;
        transition: transform .15s ease, box-shadow .15s ease;
      }

      a:hover, a:focus-visible {
        box-shadow: 1px 1px 0 var(--ink);
        outline: none;
        transform: translate(3px, 3px);
      }

      .footer {
        border-top: 2px solid var(--ink);
        font-size: .67rem;
        letter-spacing: .08em;
        padding: .85rem 1.15rem;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body id="inicio">
    <main aria-labelledby="title">
      <div class="stamp">Confirmação recebida</div>
      <section class="content">
        <div class="mark" aria-hidden="true">✓</div>
        <h1 id="title">Obrigado.</h1>
        <p><strong>Tudo certo:</strong> recebemos sua mensagem. Em breve, entraremos em contato.</p>
        <a href="#inicio">Voltar ao início</a>
      </section>
      <div class="footer">Até breve — sua solicitação está a caminho.</div>
    </main>
  </body>
</html>
