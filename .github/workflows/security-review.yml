name: Manual security review
# No cron or automatic runner spend is enabled by this change.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Um-so/union-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream tag
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream tag
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-fund
      - run: npm rebuild esbuild --ignore-scripts=false
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
      - run: npm run test:sites
